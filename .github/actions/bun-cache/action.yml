name: Bun install cache
description: >
  Restore bun's global install cache (~/.bun/install/cache) on every run,
  and save it only after a push to main. Separate from setup-bun's own
  cache, which covers only the downloaded bun binary. One job per host
  platform saves a given key; pull requests only restore. The key includes
  runner architecture, environment, pinned Bun version, and lockfile.
  Version-specific fallbacks never cross host platforms or Bun versions.
inputs:
  mode:
    description: "restore or save"
    required: true
runs:
  using: composite
  steps:
    - name: Restore bun cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ~/.bun/install/cache
        key: bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('web/.bun-version') }}-${{ hashFiles('web/bun.lock') }}
        restore-keys: |
          bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('web/.bun-version') }}-
    - name: Save bun cache
      if: inputs.mode == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.bun/install/cache
        key: bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('web/.bun-version') }}-${{ hashFiles('web/bun.lock') }}
