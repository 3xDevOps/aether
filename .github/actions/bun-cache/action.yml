name: Bun install cache
description: >
  Restore bun's global install cache (~/.bun/install/cache) on every run,
  and save it only after a push to main. Separate from setup-bun's own
  cache, which covers only the downloaded bun binary. One Linux job may
  save a given key, and a pull-request cache can evict the default-branch
  cache, so a pull request restores and does not save. The key includes
  runner.environment so a self-hosted archive is never restored onto a
  hosted VM.
inputs:
  mode:
    description: "restore or save"
    required: true
runs:
  using: composite
  steps:
    - name: Restore bun cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('web/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.environment }}-
    - name: Save bun cache
      if: inputs.mode == 'save' && github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('web/bun.lock') }}
