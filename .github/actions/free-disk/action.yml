name: Free runner disk
description: >
  Delete preinstalled toolchains no Aether job uses, so the Docker image
  builds and Go caches of a job fit the runner's disk. The Android build
  uses its own pinned SDK container, not the runner's SDK. Later steps get
  TMPDIR=/t on the root disk: Blacksmith's tmpfs /tmp fails the server's
  disk-headroom check, and /t keeps test socket paths under the unix
  limit. sudo steps must pass it through.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        df -h / /tmp
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo install -d -m 1777 /t
        echo "TMPDIR=/t" >> "$GITHUB_ENV"
        df -h /
