name: Go build cache
description: >
  Restore Go's module and build caches on every run, and save them only
  after a push to main, so main's entries stay the one hot copy every pull
  request restores instead of each pull request filling its own scope. Used
  after actions/setup-go with its own cache disabled, once per Go job: the
  save key carries the commit sha, which keeps the build cache fresh where
  setup-go's go.sum-only key would let it go stale.
inputs:
  mode:
    description: "restore or save"
    required: true
runs:
  using: composite
  steps:
    - name: Resolve Go cache paths
      id: paths
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    # The save key carries the commit sha so every push refreshes the cache
    # instead of reusing a stale one from the first commit that ever hashed
    # to this go.sum (actions/cache/save never overwrites an existing key).
    # Restore falls back through the sha-less prefixes to find the newest
    # match for the same go.sum, then any go.sum, on a cache miss.
    - name: Restore Go cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.paths.outputs.mod }}
          ${{ steps.paths.outputs.build }}
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-
    - name: Save Go cache
      if: inputs.mode == 'save' && github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.paths.outputs.mod }}
          ${{ steps.paths.outputs.build }}
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
