name: Go build cache
description: >
  Restore separate Go module and compiler caches after actions/setup-go
  with its own cache disabled. Only main pushes save; one job per host
  saves modules, and one job per variant saves its compiler cache.
  Host, runner environment and resolved toolchain isolate all archives.
inputs:
  mode:
    description: "restore or save"
    required: true
  variant:
    description: "Compiler cache lane (native or a distinct cross-build target)"
    default: native
  save-modules:
    description: "Save modules from the single designated writer for this host"
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve Go cache paths and toolchain
      id: paths
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "toolchain=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
    # Module downloads are immutable for the toolchain and dependency digest.
    # A miss only fetches dependencies normally; no validation is skipped.
    - name: Restore Go modules
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.mod }}
        key: go-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.paths.outputs.toolchain }}-${{ hashFiles('go.mod', 'go.sum') }}
    # Refresh compiler archives per commit. Fallback stays within the same
    # host, toolchain, dependency digest and lane, never another target.
    - name: Restore Go compiler cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.paths.outputs.toolchain }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ inputs.variant }}-${{ github.sha }}
        restore-keys: |
          go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.paths.outputs.toolchain }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ inputs.variant }}-
    - name: Save Go modules
      if: inputs.mode == 'save' && inputs.save-modules == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.paths.outputs.mod }}
        key: go-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.paths.outputs.toolchain }}-${{ hashFiles('go.mod', 'go.sum') }}
    - name: Save Go compiler cache
      if: inputs.mode == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.paths.outputs.toolchain }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ inputs.variant }}-${{ github.sha }}
