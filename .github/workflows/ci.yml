name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  # Explicit permissions replace the default token scope. The changes job
  # lists pull request files, which needs this in addition to contents.
  pull-requests: read

# A newer push to a pull request cancels that pull request's run in flight.
# Pushes to main run to completion so every main commit keeps its own CI
# verdict and cache write. The event name is in the group so a pull_request
# run from this branch does not cancel the base branch's in-flight run of
# the same workflow under the trigger this file replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted runners are ephemeral, so untrusted pull request code does
# not need an admin gate before checkout. Caches save only on pushes to
# main. Go module archives are separate from compiler archives, whose keys
# also include their native or cross-build lane. Each lane has one writer;
# build-and-test owns Linux amd64 native Go and bun, windows owns Windows
# native Go, and smoke owns Linux arm64 native Go. These three Go owners
# also save modules for their host. runner.environment stays in every key
# so a self-hosted archive is never restored onto a hosted VM.

jobs:
  # Lists changed files and decides whether the code jobs run. A push to
  # main and a merge-queue entry always run them. A pull request runs them
  # unless every changed path is under docs/ or is a root-level markdown
  # file. A failed file list fails open and runs them. The checkout carries
  # no credentials. The classifier is the base revision of
  # scripts/ci-classify-changes.sh: a pull request can edit its own copy,
  # and that copy is not what this job runs. A rename is classified by its
  # old path as well as its new one, so a move into docs/ still runs the
  # code jobs. The edge output follows the same rules with
  # scripts/ci-classify-edge.sh, and a failure of that classifier alone
  # also fails open.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      edge: ${{ steps.classify.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/ci-classify-changes.sh
            scripts/ci-classify-edge.sh
          sparse-checkout-cone-mode: false
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "edge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # previous_filename covers a rename into docs/: the destination
          # alone would look like a docs-only change and skip the code jobs.
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "edge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(printf '%s\n' "$files" | sh scripts/ci-classify-changes.sh)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if ! edge=$(printf '%s\n' "$files" | sh scripts/ci-classify-edge.sh); then
            edge=true
          fi
          echo "edge=$edge" >> "$GITHUB_OUTPUT"

  # Runs on every pull request, including a docs-only one. This is the
  # docs-only gate.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public boundary
        run: sh scripts/public-audit.sh

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Lint workflows
        run: make lint-workflows
      # Advisory only: the reachable Moby CVEs have no fixed release and
      # govulncheck cannot suppress individual findings, so a hard gate would
      # keep CI permanently red. Read the step output, do not ignore it.
      - name: Vulnerability scan (advisory)
        run: make vulncheck
        continue-on-error: true
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1
          skip-cache: true

  build-and-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      # `make build` builds the embedded dashboard SPA before Go compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      - name: Unit tests
        run: make test
      - name: Build binaries
        run: make build
      # Own the Linux amd64 module and native compiler archives, plus bun.
      # Other native Linux amd64 jobs restore only; cross-build jobs save
      # their own compiler variants without racing this module writer.
      # Saved on a red run too: a failed test does not invalidate compiled
      # objects or downloaded modules, and a flaky suite would otherwise leave
      # every following run cold.
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          mode: save
          save-modules: 'true'
      - uses: ./.github/actions/bun-cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          mode: save

  scripts:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell script tests
        run: make test-scripts
      - name: Native hook lifecycle tests
        run: make test-native-hooks

  # internal/harness needs the agent images built here. The independent
  # integration shards start without waiting for these images.
  smoke:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    # Native compilation and execution on both supported run architectures.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The standard image is what runs actually execute on, so the agent
      # CLIs are smoke-tested on it and not on some thinner stand-in. It is
      # built here rather than pulled so the test matches this checkout,
      # and cached so only a Dockerfile change pays for it. Only pushes to
      # main write this scope. A pull request restores that cache and does
      # not write another copy of the image layers into the repository cache.
      - name: Build the standard environment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/standard/Dockerfile
          load: true
          tags: aether-standard:ci
          cache-from: type=gha,scope=standard-${{ matrix.arch }}-main
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=standard-{0}-main', matrix.arch) || '' }}
      - name: Prove standard environment tools and native Git
        run: sh scripts/standard-image-smoke.sh aether-standard:ci
      # The agent CLIs on top, at whatever version their vendors ship
      # today: that is the drift this image exists to catch. It carries no
      # credentials, which is exactly what TestSmokeHeadlessNoLogin needs.
      #
      # It has to build on the "default" builder, the one backed by the
      # Docker daemon, because that is the only builder that can see the
      # image the step above loaded. The container builder buildx sets up
      # keeps its own store, so it would resolve BASE as a registry
      # reference and go looking for it on Docker Hub.
      - name: Build the agent smoke image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          opencode=$(gh release view --repo anomalyco/opencode --json tagName --jq '.tagName | ltrimstr("v")')
          docker buildx build --builder default --load --no-cache \
            --build-arg BASE=aether-standard:ci \
            --build-arg "OPENCODE_VERSION=$opencode" \
            --tag aether-smoke:ci \
            --file images/smoke/Dockerfile .
      - name: Real-harness smoke test (real Docker, real git)
        env:
          AETHER_SMOKE_IMAGE_CLAUDE_NOLOGIN: aether-smoke:ci
          AETHER_SMOKE_IMAGE_CODEX_NOLOGIN: aether-smoke:ci
          AETHER_SMOKE_IMAGE_OPENCODE_NOLOGIN: aether-smoke:ci
        run: make test-integration INTEGRATION_PKGS=./internal/harness
      - name: Export the tested standard image
        if: matrix.arch == 'amd64'
        run: docker save --output "$RUNNER_TEMP/aether-standard.tar" aether-standard:ci
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: standard-image-amd64
          path: ${{ runner.temp }}/aether-standard.tar
          compression-level: 0
          retention-days: 1
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && matrix.arch == 'arm64' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          mode: save
          save-modules: 'true'

  # Build the same Dockerfile on both supported server architectures. This
  # gate is display-free; browser libraries and Chromium exist only inside
  # the image, and no registry write credentials enter a PR job.
  browser:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - uses: docker/setup-buildx-action@v3
      - name: Build the browser companion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/browser/Dockerfile
          load: true
          tags: aether/browser:test
          cache-from: type=gha,scope=browser-${{ matrix.arch }}-main
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=browser-{0}-main', matrix.arch) || '' }}
      - name: Prove headless Chromium sandbox and companion behavior
        run: make browser-smoke
      # The installed server owns UID-1000 control directories as root.
      # Match that authority, not a chmod 777 workaround for the test runner.
      - name: Exercise the real browser runtime
        run: sudo env "PATH=$PATH" "HOME=$HOME" AETHER_BROWSER_TEST_IMAGE=aether/browser:test go test -race -timeout=10m -tags=integration ./internal/runtime -run '^TestDockerBrowser' -v
      - name: Save the tested image for server and dashboard scenarios
        if: matrix.arch == 'amd64'
        run: docker save --output "$RUNNER_TEMP/aether-browser.tar" aether/browser:test
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: browser-image-amd64
          path: ${{ runner.temp }}/aether-browser.tar
          retention-days: 1

  # A pull request runs the edge image build and smoke test only when
  # scripts/ci-classify-edge.sh says a changed path can affect the image.
  # A workflow of its own so it can be started by hand on any branch.
  edge-image:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.edge == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/edge-image.yml

  # Five shards cover internal/server by test name, balanced by the durations
  # -v prints; scheduler is its own package; rest dynamically discovers every
  # other integration package. Only server-rest needs the browser image, so
  # the six image-independent shards do not wait for or transfer it.
  integration:
    name: integration (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    # ubuntu-latest provides Docker for these real-runtime tests.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server-chaos
            make: INTEGRATION_PKGS=./internal/server INTEGRATION_RUN=^TestIntegrationChaos
          - shard: server-coordination
            make: INTEGRATION_PKGS=./internal/server INTEGRATION_RUN=^TestIntegrationCoordination
          - shard: server-mission
            make: INTEGRATION_PKGS=./internal/server INTEGRATION_RUN=^TestIntegrationMission
          - shard: server-heavy
            make: INTEGRATION_PKGS=./internal/server INTEGRATION_RUN='^TestIntegration(EndToEnd|MultiMember|ServerUpdate)'
          - shard: scheduler
            make: INTEGRATION_PKGS=./internal/scheduler
          - shard: rest
            make: INTEGRATION_SKIP="./internal/harness ./internal/scheduler ./internal/server" INTEGRATION_SKIP_PATTERN='^TestDockerBrowser'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      # The matrix values are literals from this file, passed as make
      # assignments. -v prints each test's duration, which is what the
      # shards are balanced by.
      - name: Integration tests (real Docker, real git)
        env:
          GOFLAGS: -v
          AETHER_BROWSER_TEST_IMAGE: aether/browser:test
          AETHER_BROWSER_IMAGE: aether/browser:test
        # Preserve the root suite as well as the separate non-root unit suite:
        # ownership and recovery tests exercise different privilege branches.
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "GOFLAGS=$GOFLAGS" \
            "AETHER_BROWSER_TEST_IMAGE=$AETHER_BROWSER_TEST_IMAGE" \
            "AETHER_BROWSER_IMAGE=$AETHER_BROWSER_IMAGE" \
            make test-integration ${{ matrix.make }}

  integration-server-rest:
    name: integration (server-rest)
    needs: [changes, browser]
    if: ${{ !cancelled() && needs.browser.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - uses: actions/download-artifact@v4
        with:
          name: browser-image-amd64
          path: ${{ runner.temp }}
      - name: Load the tested browser companion
        run: docker load --input "$RUNNER_TEMP/aether-browser.tar"
      - name: Integration tests (real Docker, real git)
        env:
          GOFLAGS: -v
          AETHER_BROWSER_TEST_IMAGE: aether/browser:test
          AETHER_BROWSER_IMAGE: aether/browser:test
        # The installed service runs as root to assign private browser control
        # directories to UID 1000. Keep that boundary in real server scenarios.
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "GOFLAGS=$GOFLAGS" \
            "AETHER_BROWSER_TEST_IMAGE=$AETHER_BROWSER_TEST_IMAGE" \
            "AETHER_BROWSER_IMAGE=$AETHER_BROWSER_IMAGE" \
            make test-integration INTEGRATION_PKGS=./internal/server \
              INTEGRATION_SKIP_PATTERN='^TestIntegration(Chaos|Coordination|Mission|EndToEnd|MultiMember|ServerUpdate)'

  dashboard:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Typecheck
        run: bun run typecheck
        working-directory: web
      - name: SPA tests
        run: bun run test
        working-directory: web

  # The dashboard driven the way a person drives it: a real browser against a
  # real `aether gui` gateway and a real aether-server, with real Docker and
  # real git. Separate from `dashboard` because that job is the fast jsdom
  # gate and this one starts containers.
  dashboard-e2e:
    name: dashboard-e2e (${{ matrix.shard }}/4)
    needs: [changes, browser, smoke]
    if: ${{ !cancelled() && needs.browser.result == 'success' && needs.smoke.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      # The browser download is keyed on the pinned Playwright version, so a
      # run only pays for it when that pin moves. actions/cache stores paths
      # relative to the workspace, so an archive from another runner
      # environment unpacks somewhere else on a GitHub-hosted runner; the key
      # includes runner.environment so a self-hosted archive is never restored
      # onto a hosted VM. Restored on every run and saved only after a push
      # to main, same rule as the Go and bun caches: one job may save a given
      # key, and a pull-request cache can evict the default-branch cache.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.environment }}-${{ steps.playwright.outputs.version }}
      # Runs on a cache hit too: it skips a browser that is already present
      # and installs the system libraries, which the cache never holds. A
      # cache that restored nothing usable then costs a download, never the
      # suite.
      - name: Install the browser
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          bunx playwright install --with-deps chromium
        working-directory: web
      - uses: actions/download-artifact@v4
        with:
          name: browser-image-amd64
          path: ${{ runner.temp }}
      - name: Load the tested browser companion
        run: docker load --input "$RUNNER_TEMP/aether-browser.tar"
      - uses: actions/download-artifact@v4
        with:
          name: standard-image-amd64
          path: ${{ runner.temp }}
      - name: Load the tested standard environment
        run: docker load --input "$RUNNER_TEMP/aether-standard.tar"
      - name: Dashboard end-to-end suite
        env:
          AETHER_BROWSER_TEST_IMAGE: aether/browser:test
          AETHER_BROWSER_IMAGE: aether/browser:test
          AETHER_E2E_STANDARD_IMAGE: aether-standard:ci
        # The server spawned by Playwright needs the installed service's
        # ownership authority; Chromium itself remains sandboxed in Docker.
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "CI=$CI" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "AETHER_BROWSER_TEST_IMAGE=$AETHER_BROWSER_TEST_IMAGE" \
            "AETHER_BROWSER_IMAGE=$AETHER_BROWSER_IMAGE" \
            "AETHER_E2E_STANDARD_IMAGE=$AETHER_E2E_STANDARD_IMAGE" \
            make test-e2e E2E_ARGS='--shard=${{ matrix.shard }}/4'
      # Uploaded on a pass too: the mobile project attaches a full-page
      # screenshot of every phone scenario, and a layout can be wrong with
      # every assertion green. Not on a cancelled job, which has no report.
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.environment }}-${{ steps.playwright.outputs.version }}

  # The desktop shell is built the way users build it: `aether gui build`
  # unpacks the sources embedded in the CLI and runs electron-builder.
  desktop:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Both `aether gui build` steps below run npm install, the first with
      # this system npm and the second with a Node the CLI downloads for
      # itself; npm's cache directory defaults to ~/.npm regardless of which
      # npm binary runs, so one cache covers both. Restored on every run and
      # saved only after a push to main, same rule as the Go cache.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('desktop/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.environment }}-
      - name: Install desktop validation tools
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y desktop-file-utils
      - name: Build the CLI
        run: mkdir -p web/dist && go build -o "$HOME/.local/bin/aether" ./cmd/aether
      - name: aether gui build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          aether gui build
          desktop-file-validate ~/.local/share/applications/aether-desktop.desktop
          test -x ~/.local/share/aether/desktop/aether-desktop
      # Proves the app builds on a machine with no Node at all: with node,
      # npm and npx off PATH, the CLI has to download its own copy into the
      # cache directory and build with that. The directories that carry node
      # also carry sh and the rest of the toolchain, so they are mirrored
      # into a shadow of symlinks with those three names left out rather
      # than dropped.
      - name: aether gui build without Node on PATH
        run: |
          shadow="$RUNNER_TEMP/no-node"
          mkdir -p "$shadow"
          clean=""
          IFS=:
          for dir in $PATH; do
            unset IFS
            [ -d "$dir" ] || continue
            if [ -x "$dir/node" ] || [ -x "$dir/npm" ] || [ -x "$dir/npx" ]; then
              for tool in "$dir"/*; do
                name="${tool##*/}"
                case "$name" in node | npm | npx | corepack | '*') continue ;; esac
                # -e is false for a dangling link, and two PATH directories
                # can carry the same name, so a failed ln is expected and
                # must not end the step. scripts/install-test.sh does the
                # same for the same reason.
                [ -e "$shadow/$name" ] || ln -s "$tool" "$shadow/$name" 2>/dev/null || true
              done
            else
              clean="${clean:+$clean:}$dir"
            fi
          done
          # No empty PATH entry: that would put the checkout's own directory
          # on PATH when every directory carried node.
          export PATH="$HOME/.local/bin:$shadow${clean:+:$clean}"
          if command -v node; then echo "node is still on PATH" >&2; exit 1; fi
          aether gui build
          test -d ~/.cache/aether/node ||
            { echo "no Node was downloaded into ~/.cache/aether/node" >&2; exit 1; }
          find ~/.cache/aether/node -type f -name node -perm -u+x | grep -q . ||
            { echo "the downloaded Node has no executable node" >&2; exit 1; }
          test -x ~/.local/share/aether/desktop/aether-desktop
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('desktop/package.json') }}

  # The client ships for Windows, so it gets a real Windows runner. Only the
  # client's package closure is built and tested: the server is Linux-only by
  # design and internal/gitengine does not compile for Windows. Docs-only
  # pull requests skip this job. changes does not choose the runner.
  windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # windows-latest defaults to PowerShell, where command substitution and
      # grep are unavailable. Git Bash is preinstalled, which the go-cache
      # action also relies on to resolve `go env` cache paths.
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - name: Client packages build and vet
        shell: bash
        run: |
          pkgs=$(go list -deps ./cmd/aether | grep '^github.com/3xDevOps/Aether/')
          mapfile -t packages <<< "$pkgs"
          go build ./cmd/aether
          go vet ./cmd/aether "${packages[@]}"
      - name: Client unit tests
        shell: bash
        run: |
          pkgs=$(go list -deps ./cmd/aether | grep '^github.com/3xDevOps/Aether/')
          mapfile -t packages <<< "$pkgs"
          go test ./cmd/aether "${packages[@]}"
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          mode: save
          save-modules: 'true'

  # Reuse the installer lanes so their verdict is part of CI and therefore
  # the exact-commit CI success required by release authorization.
  windows-install:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    uses: ./.github/workflows/windows-install.yml

  release-build:
    name: release-build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so git describe can version the build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
          variant: release-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      - name: Cross-compile release binaries
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          linux_platforms=""
          if [ "$TARGET_OS" = linux ]; then
            linux_platforms="linux/$TARGET_ARCH"
          fi
          make release-binaries \
            SERVER_PLATFORMS="$linux_platforms" \
            EDGE_PLATFORMS="$linux_platforms" \
            CLI_PLATFORMS="$TARGET_OS/$TARGET_ARCH"
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          mode: save
          variant: release-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    # A wedged Gradle daemon must not hold the runner for the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so git describe can version the build
      # The pinned SDK container carries the Android toolchain. Keep only
      # Gradle's dependency and distribution caches, inside the workspace so
      # the archive restores at the same path. Only this main job writes it.
      - uses: actions/cache/restore@v4
        with:
          path: .gradle-cache
          key: gradle-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.environment }}-
      # The wrapper jar is committed, and gradle-wrapper.properties pins the
      # distribution by sha256; this is what checks the jar itself against
      # Gradle's published checksums before it runs.
      #
      # Pinned by commit, not by the `v4` tag: a retargeted tag would execute
      # code nobody here has read. `v4` also trails its own line - it still
      # points at v4.4.3, while v4.4.4 is the current v4 release and carries
      # the newer known-wrapper checksums this step reads.
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build and test unsigned Android artifacts
        env:
          ANDROID_GRADLE_HOME: ${{ github.workspace }}/.gradle-cache
        run: make android
      # The daemon logs and the compiled-script caches are large and
      # machine-specific; saving them would cost more than it returns.
      - name: Trim the Gradle cache before it is saved
        if: ${{ !cancelled() }}
        run: rm -rf .gradle-cache/daemon .gradle-cache/native
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: .gradle-cache
          key: gradle-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle.properties', 'android/**/*.gradle.kts') }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-android
          path: |
            dist/aether-android-unsigned.apk
            dist/aether-android-unsigned.aab
          if-no-files-found: error
          retention-days: 7

  # Scans the binaries the release matrix just produced with the Defender
  # build that ships on the runner. A detection here is the same failure a
  # user hits: the download is blocked, or the client is quarantined on first
  # run. It is signal, not a flake - the response is to submit the binary at
  # https://www.microsoft.com/en-us/wdsi/filesubmission as a developer false
  # positive, and to check what changed in the client's syscalls or embedded
  # strings. See docs/install.md. Skipped when release-build is skipped.
  windows-defender:
    needs: release-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Arm Defender before downloading binaries
        shell: powershell
        run: ./scripts/windows-defender.ps1 -Mode Prepare
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-go-windows-*
          merge-multiple: true
          path: dist
      - name: Scan both Windows clients
        shell: powershell
        run: ./scripts/windows-defender.ps1 -Mode Scan -ArtifactDirectory dist
