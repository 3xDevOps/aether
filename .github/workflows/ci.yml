name: CI

on:
  push:
    branches: [main]
  # A pull request runs changes, audit, lint, build-and-test and dashboard
  # only. The merge queue and the nightly run on main run every job. A push to
  # main runs only changes and CI gate when its commit passed the merge queue
  # and changed nothing a cache key hashes.
  pull_request:
  merge_group:
  # Refreshes the per-commit caches, which only a run on main can write, and
  # tests main against today's agent CLIs, mirrors and published release.
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  # Explicit permissions replace the default token scope. The changes job
  # lists pull request files, which needs this in addition to contents.
  pull-requests: read

# A newer push to a pull request cancels that pull request's run in flight.
# Pushes to main and merge queue entries group by commit, so none cancels or
# replaces another and every main commit keeps its own CI verdict and cache
# write. The event name is in the group so a pull_request
# run from this branch does not cancel the base branch's in-flight run of
# the same workflow under the trigger this file replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted runners are ephemeral, so untrusted pull request code does
# not need an admin gate before checkout. Caches save only on runs on main:
# a merge-queue run's caches are scoped to its own queue branch. Go module
# archives are separate from compiler archives, whose keys also include their native or cross-build lane. Each lane has one writer;
# build-and-test owns Linux amd64 native Go and bun, windows owns Windows
# amd64 native Go, arm64 owns Linux arm64 native Go, and the windows-install
# arm64 update leg owns Windows arm64 Go. These four Go owners also save
# modules for their host. Each windows-install update leg owns its
# architecture's Windows npm caches.
# runner.environment stays in every key so a self-hosted archive is never
# restored onto a hosted VM.

jobs:
  # Lists changed files and decides whether the code jobs run. A merge-queue
  # entry and the nightly run always run them. A push to main runs them
  # unless scripts/ci-queue-verdict.sh finds the merge-queue run that passed
  # on this commit and the push changed no cache key input. On a pull request
  # scripts/ci-classify-areas.sh sets go and web: a change confined to
  # docs/ and root-level markdown files skips both, one confined to web/
  # skips the Go jobs, and one that no dashboard input can see skips
  # dashboard.
  # Each classifier is the base revision's copy: a pull request can edit
  # its own, and that copy is not what this job runs. A rename is
  # classified by its old path as well as its new one, so a move into docs/
  # still runs the code jobs. A failed file list, or a failure of any
  # classifier alone, fails open and runs them. The checkout carries no
  # credentials.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: write lets the merge queue step below cancel runs.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.classify.outputs.go }}
      web: ${{ steps.classify.outputs.web }}
      suite: ${{ steps.classify.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/ci-classify-areas.sh
            scripts/ci-queue-verdict.sh
            scripts/ci-reap-queue-runs.sh
          sparse-checkout-cone-mode: false
      # The merge queue discards a group when an entry ahead of it leaves or
      # the queue is reordered, but GitHub does not stop that group's run,
      # which keeps holding runners.
      - name: Cancel runs of discarded merge groups
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-reap-queue-runs.sh "$GITHUB_REPOSITORY" "${GITHUB_REF#refs/heads/}"
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            verdict=$(sh scripts/ci-queue-verdict.sh "$GITHUB_REPOSITORY" "$BEFORE" "$GITHUB_SHA") || verdict=
            if [ -n "$verdict" ]; then
              echo "The merge queue passed this commit in $verdict; this push runs no other job." >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' go=false web=false suite=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf '%s\n' go=true web=true suite=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo suite=false >> "$GITHUB_OUTPUT"
          # previous_filename covers a rename into docs/: the destination
          # alone would look like a docs-only change and skip the code jobs.
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            printf '%s\n' go=true web=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for mode in go web; do
            if ! out=$(printf '%s\n' "$files" | sh scripts/ci-classify-areas.sh "$mode"); then
              out=true
            fi
            echo "$mode=$out" >> "$GITHUB_OUTPUT"
          done

  # Runs on every pull request, including a docs-only one. This is the
  # docs-only gate.
  audit:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'pull_request' || needs.changes.outputs.suite == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public boundary
        run: sh scripts/public-audit.sh

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      - name: Check formatting
        run: make fmt-check
      - name: Lint workflows
        run: make lint-workflows
      # Advisory only: the reachable Moby CVEs have no fixed release and
      # govulncheck cannot suppress individual findings, so a hard gate would
      # keep CI permanently red. Read the step output, do not ignore it.
      - name: Vulnerability scan (advisory)
        if: ${{ github.event_name != 'pull_request' }}
        run: make vulncheck
        continue-on-error: true
      - name: Restore golangci-lint analysis cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yml') }}-
      # golangci-lint runs go vet's analyzers plus shadow over the default
      # and edgeupgrade builds, so a separate `make vet` would compile the
      # tree a second time for the same findings.
      - name: Lint
        run: make lint
      - name: Save golangci-lint analysis cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yml') }}-${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell script tests
        run: make test-scripts
      - name: Native hook lifecycle tests
        run: make test-native-hooks

  build-and-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      # `make build` builds the embedded dashboard SPA before Go compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      - name: Unit tests
        env:
          TEST_RACE: ${{ github.event_name != 'pull_request' && '-race' || '' }}
        run: make test
      - name: Build binaries
        run: make build
      # Own the Linux amd64 module and native compiler archives, plus bun.
      # Other native Linux amd64 jobs restore only; cross-build jobs save
      # their own compiler variants without racing this module writer.
      # Saved on a red run too: a failed test does not invalidate compiled
      # objects or downloaded modules, and a flaky suite would otherwise leave
      # every following run cold.
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          mode: save
          save-modules: 'true'
      - uses: ./.github/actions/bun-cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          mode: save

  dashboard:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Typecheck
        run: bun run typecheck
        working-directory: web
      - name: SPA tests
        run: bun run test
        working-directory: web

  # Everything else, in a workflow of its own so a run that skips it shows
  # one skipped check.
  suite:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.suite == 'true') }}
    uses: ./.github/workflows/ci-suite.yml

  # The one required check on main, for pull requests and merge queue
  # entries. It fails when any job failed or was cancelled; outside the merge
  # queue, a job its own rule skipped passes. A job missing from needs does
  # not gate main; the jobs in ci-suite.yml gate it through suite.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - changes
      - audit
      - lint
      - build-and-test
      - dashboard
      - suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No job's rule skips it in the merge queue, so a skip there means a
      # cancellation kept it from starting.
      - name: Require every job to pass or be skipped by its rule
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP_PASSES: ${{ github.event_name != 'merge_group' }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          bad=$(printf '%s' "$NEEDS" | jq -r --argjson skip "$SKIP_PASSES" '[to_entries[] | select(.value.result != "success" and (.value.result != "skipped" or ($skip | not))) | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::Not passed: $bad"
            exit 1
          fi
