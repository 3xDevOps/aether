name: Promote edge

# Moves ghcr.io/3xdevops/aether-edge:<channel> to a published release's
# image, by copying the exact index the release signed and attested. It
# never builds and never moves a channel to an older build. An admin
# dispatches it for stable; promote.yml calls it for beta and nightly.yml
# for nightly. docs/edge.md, Promoting an edge release to stable,
# describes when to run it.
on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag to promote
        required: true
        type: string
      digest:
        description: Index digest of ghcr.io/3xdevops/aether-edge:<tag>, sha256:<64 hex>
        required: true
        type: string
      channel:
        description: Image tag to move, beta or nightly; the caller's own checks cover the call
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to promote, such as v0.8.0
        required: true
        type: string
      digest:
        description: Index digest of ghcr.io/3xdevops/aether-edge:<tag>, sha256:<64 hex>
        required: true
        type: string
      soak_override_reason:
        description: Why to promote a release published less than 24 hours ago; empty enforces the soak
        required: false
        type: string
        default: ''

permissions: {}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/3xdevops/aether-edge
  # A dispatch has no channel input and moves stable.
  CHANNEL: ${{ inputs.channel || 'stable' }}
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  publisher-policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.select.outputs.allowed }}
    steps:
      # Hosts trust only a promotion attestation whose signer is
      # promote-edge.yml@refs/heads/main, and a called workflow runs at its
      # caller's ref, so a run from any other ref could not move a host
      # anyway.
      - name: Require main and a known channel
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::promote-edge runs only from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
          case $CHANNEL in
          nightly | beta | stable) ;;
          *)
            echo "::error::channel $CHANNEL is not nightly, beta or stable"
            exit 1
            ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          persist-credentials: false
      # Moving stable is an admin's own dispatch. beta moves only from
      # Promote, which ran its admin check before it built the release, and
      # nightly only from nightly.yml, which built a green main commit; in a
      # called workflow GITHUB_WORKFLOW_REF names the caller.
      - name: Check the promoter
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $CHANNEL in
          stable) sh scripts/require-admin.sh "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR" ;;
          *)
            caller=promote.yml
            if [ "$CHANNEL" = nightly ]; then caller=nightly.yml; fi
            if [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/$caller@refs/heads/main" ]; then
              echo "::error::only $caller on main moves $CHANNEL, not $GITHUB_WORKFLOW_REF"
              exit 1
            fi
            ;;
          esac
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  promote:
    needs: publisher-policy
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    environment: edge-promotion
    # One move of a channel's tag at a time, so two cannot interleave their
    # checks of what it carries. Per channel: promote.yml's calls are
    # already one at a time, and GitHub would cancel a call left pending
    # behind a stable dispatch in a shared group.
    concurrency:
      group: promote-edge-${{ inputs.channel || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
      DIGEST: ${{ inputs.digest }}
      REASON: ${{ inputs.soak_override_reason }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The verifier, its embedded release keys and the version ordering
      # come from main, never from the release being promoted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          persist-credentials: false
      # Re-running this job alone skips publisher-policy, and for a call
      # also its caller's admin check. A scheduled nightly has no admin
      # behind it, so its caller rule is checked again instead.
      - name: Require an admin, or nightly.yml on main for nightly
        run: |
          if [ "$CHANNEL" != nightly ]; then
            sh scripts/require-admin.sh "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"
          elif [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/nightly.yml@refs/heads/main" ]; then
            echo "::error::only nightly.yml on main moves nightly, not $GITHUB_WORKFLOW_REF"
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install crane
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate the inputs
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-<prerelease>"
            exit 1
          fi
          if ! [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest $DIGEST is not sha256:<64 lowercase hex>"
            exit 1
          fi
      - name: Require a published release
        id: release
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [ "$(printf '%s' "$release" | jq -r .draft)" != false ]; then
            echo "::error::release $TAG is a draft; promote only a published release"
            exit 1
          fi
          echo "published_at=$(printf '%s' "$release" | jq -er .published_at)" >> "$GITHUB_OUTPUT"
      - name: Verify the signed manifest names this edge image
        id: manifest
        run: |
          go build -o "$RUNNER_TEMP/aether-edge" ./cmd/aether-edge
          mkdir "$RUNNER_TEMP/kept"
          "$RUNNER_TEMP/aether-edge" release-check --tag "$TAG" --digest "$DIGEST" --from "$TAG" --from-digest "$DIGEST" \
            --channel "$CHANNEL" --keep-manifests "$RUNNER_TEMP/kept" --json >/dev/null
          channel=$(jq -r '.channel // ""' "$RUNNER_TEMP/kept/$TAG.json")
          # Whatever the tag carries now, even nothing.
          sh scripts/edge-channel-takes.sh "$CHANNEL" "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Require a 24-hour soak
        if: env.CHANNEL == 'stable'
        env:
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          age=$(( $(date +%s) - $(date -d "$PUBLISHED_AT" +%s) ))
          if [ "$age" -lt 86400 ] && [ -z "$REASON" ]; then
            echo "::error::$TAG was published $((age / 3600)) hours ago; wait until 24 hours have passed or give soak_override_reason"
            exit 1
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the tag, its attestation and anonymous pulls
        run: |
          tagged=$(crane digest "$IMAGE:$TAG")
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TAG is $tagged, not $DIGEST"
            exit 1
          fi
          sh scripts/edge-attestation.sh verify "$IMAGE@$DIGEST" "$TAG"
          anonymous=$(mktemp -d)
          DOCKER_CONFIG=$anonymous crane manifest "$IMAGE@$DIGEST" > "$RUNNER_TEMP/index.json"
          platforms=$(jq -er '.manifests | select(length == 2) | map(.digest) | join(" ")' "$RUNNER_TEMP/index.json")
          for platform in $platforms; do
            sh scripts/edge-attestation.sh verify "$IMAGE@$platform" "$TAG"
            DOCKER_CONFIG=$anonymous crane manifest "$IMAGE@$platform" >/dev/null
          done
      # The run is the one the image's attestation names: a promote.yml run
      # for a release Promote built, release.yml for a pushed tag.
      - name: Require the run that built the release to have qualified the edge
        run: |
          evidence=$(sh scripts/edge-attestation.sh qualify "$IMAGE@$DIGEST" "$TAG")
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
      # By the signed manifests' (build, hotfix), the order hosts use. Hosts
      # on the channel hold at a release they cannot upgrade from, so the
      # tag must not skip past min_upgrade_from; a blocking manual step only
      # makes them wait for their operator. A release from before channels
      # orders as latest does, by version, so stable keeps taking them
      # until the first channel stable.
      - name: Refuse to move the channel backwards or past min_upgrade_from
        id: order
        env:
          RELEASE_CHANNEL: ${{ steps.manifest.outputs.channel }}
        run: |
          if ! current=$(crane digest "$IMAGE:$CHANNEL" 2>"$RUNNER_TEMP/current.err"); then
            if ! grep -q MANIFEST_UNKNOWN "$RUNNER_TEMP/current.err"; then
              echo "::error::cannot read $IMAGE:$CHANNEL: $(cat "$RUNNER_TEMP/current.err")"
              exit 1
            fi
            echo "$IMAGE:$CHANNEL does not exist yet" >> "$GITHUB_STEP_SUMMARY"
            echo "move=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          carried=$(crane config --platform linux/amd64 "$IMAGE@$current" |
            jq -er '.config.Labels["org.opencontainers.image.version"]')
          if [ "$carried" = "$TAG" ]; then
            if [ "$current" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$CHANNEL carries $carried as $current, not $DIGEST"
              exit 1
            fi
            echo "$IMAGE:$CHANNEL already is $TAG, \`$DIGEST\`; nothing moved" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          order=$CHANNEL
          if [ "$CHANNEL" = stable ] && [ -z "$RELEASE_CHANNEL" ]; then order=latest; fi
          status=0
          "$RUNNER_TEMP/aether-edge" release-check --tag "$TAG" --digest "$DIGEST" --from "$carried" --from-digest "$current" \
            --channel "$order" --json > "$RUNNER_TEMP/order.json" || status=$?
          if [ "$status" != 0 ]; then
            if ! jq -e '.hold and (.reasons | length) == ([.applicable_steps[] | select(.blocking)] | length)' "$RUNNER_TEMP/order.json" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$CHANNEL carries $carried; release-check refuses to move it to $TAG (see its output above); promote a release between them first if $TAG upgrades only from a later one"
              exit 1
            fi
          fi
          echo "previous=$carried $current" >> "$GITHUB_OUTPUT"
          echo "move=true" >> "$GITHUB_OUTPUT"
      # crane tag writes the same manifest bytes under the new tag, so
      # stable has the digest the release signed and attested.
      - name: Move the channel tag
        if: steps.order.outputs.move == 'true'
        env:
          PREVIOUS: ${{ steps.order.outputs.previous }}
        run: |
          crane tag "$IMAGE@$DIGEST" "$CHANNEL"
          moved=$(crane digest "$IMAGE:$CHANNEL")
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$CHANNEL is $moved after the move, not $DIGEST"
            exit 1
          fi
          sh scripts/edge-attestation.sh verify "$IMAGE@$moved" "$TAG"
          anonymous=$(mktemp -d)
          test "$(DOCKER_CONFIG=$anonymous crane digest "$IMAGE:$CHANNEL")" = "$DIGEST"
          {
            echo "### $IMAGE:$CHANNEL"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tag | \`$TAG\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Previous | \`${PREVIOUS:-none}\` |"
            echo "| Actor | $GITHUB_ACTOR (run started by $GITHUB_TRIGGERING_ACTOR) |"
            echo "| Qualification | $EVIDENCE |"
            echo "| Soak override | ${REASON:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Also after a no-op, so a release promoted before this step existed
      # gains the attestation hosts require. channel is the tag moved, which
      # is what hosts on it verify, not the release's own channel.
      - name: Write the promotion predicate
        run: |
          jq -n --arg channel "$CHANNEL" --arg tag "$TAG" --arg digest "$DIGEST" '{channel: $channel, tag: $tag, digest: $digest}' \
            > "$RUNNER_TEMP/promotion.json"
      - name: Attest the promotion
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ inputs.digest }}
          predicate-type: https://github.com/3xDevOps/aether/edge-promotion/v1
          predicate-path: ${{ runner.temp }}/promotion.json
          push-to-registry: true
      - name: Verify the promotion attestation
        # The attestation API can answer a moment after the upload.
        run: |
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/promote-edge.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners \
              --predicate-type https://github.com/3xDevOps/aether/edge-promotion/v1 \
              --format json > "$RUNNER_TEMP/verified.json"; then
              jq -e --slurpfile want "$RUNNER_TEMP/promotion.json" \
                'any(.[]; .verificationResult.statement.predicate == $want[0])' "$RUNNER_TEMP/verified.json" >/dev/null
              echo "Promotion attestation: \`$IMAGE@$DIGEST\` as $CHANNEL $TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$attempt" = 5 ] || sleep 5
          done
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The check hosts run (scripts/edge-update.sh), which finds the bundle
      # through the registry's referrers rather than GitHub's API.
      - name: Verify the promotion attestation as hosts do
        run: |
          for attempt in 1 2 3 4 5; do
            if atts=$(cosign verify-attestation --new-bundle-format \
              --type https://github.com/3xDevOps/aether/edge-promotion/v1 \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/promote-edge.yml@refs/heads/main" \
              "$IMAGE@$DIGEST"); then
              printf '%s\n' "$atts" | jq -e --arg c "$CHANNEL" --arg t "$TAG" --arg d "$DIGEST" \
                '.payload | @base64d | fromjson | .predicate | select(.channel == $c and .tag == $t and .digest == $d)' >/dev/null
              exit 0
            fi
            [ "$attempt" = 5 ] || sleep 5
          done
          exit 1
