name: Release build

# Builds, signs and publishes one release. The build jobs check out the
# released commit and see no signing key; only the release job holds the
# key, and it runs main's tools on the build jobs' artifacts as data. A
# nightly is signed in the nightly environment with the nightly key, every
# other release in the release environment with the release key.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, which must name commit
        type: string
        required: true
      commit:
        description: Full SHA of the commit to build
        type: string
        required: true
      tools-commit:
        description: Full SHA of the main commit whose scripts and tools sign and publish
        type: string
        required: true
      channel:
        description: nightly, beta or stable; empty for a release from before channels
        type: string
        default: ''
      build:
        description: Build number the manifest signs
        type: number
        default: 0
      hotfix:
        description: Hotfix count on top of build
        type: number
        default: 0
      pointer:
        description: >-
          Channel whose pointer to move to this release once it is published;
          empty for none. A caller that sets this or pointer-if-above runs in the
          channels concurrency group with cancel-in-progress false. The group is
          the caller's, not a job's here: GitHub keeps one pending run per group
          and cancels the older pending one, which would cancel a waiting
          signer, and a job here in a group its caller already holds deadlocks
        type: string
        default: ''
      pointer-if-above:
        description: >-
          Channels, space-separated and in order, whose pointers to move to this
          release only when the release is above each, after pointer; empty for
          none. List beta before stable: a release above beta.json is above
          stable.json too, so beta stays at or above stable if a later entry
          fails
        type: string
        default: ''
      first-pointer:
        description: The pointer channels have never had a pointer, and this run publishes their first; only for that migration step
        type: boolean
        default: false
      signing-environment:
        description: >-
          Environment of the signing job and the key it signs with: release
          (AETHER_RELEASE_SIGNING_KEY) for beta, stable and pre-channel
          releases, nightly (AETHER_NIGHTLY_SIGNING_KEY) for nightlies and
          nightly.json only
        type: string
        default: release
      promoted:
        description: >-
          promote.yml is rebuilding a released commit under a new tag: the
          release job creates the tag once every asset is built, and the images
          are not tagged with the commit again, so those tags keep naming its
          first build
        type: boolean
        default: false
    outputs:
      edge-digest:
        description: Index digest of ghcr.io/3xdevops/aether-edge:<tag>
        value: ${{ jobs.edge-manifest.outputs.digest }}
      pointer-if-above-names-release:
        description: true when every pointer-if-above channel's pointer names this release, moved by this run or an earlier attempt
        value: ${{ jobs.release.outputs.pointer-if-above-names-release }}
    secrets:
      AETHER_RELEASE_SIGNING_KEY:
        required: false
      AETHER_NIGHTLY_SIGNING_KEY:
        required: false
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag }}
  COMMIT: ${{ inputs.commit }}
  TOOLS_COMMIT: ${{ inputs.tools-commit }}
  CHANNEL: ${{ inputs.channel }}
  BUILD: ${{ inputs.build }}
  HOTFIX: ${{ inputs.hotfix }}
  POINTER: ${{ inputs.pointer }}
  POINTER_IF_ABOVE: ${{ inputs.pointer-if-above }}
  PROMOTED: ${{ inputs.promoted }}
  SIGNING_ENVIRONMENT: ${{ inputs.signing-environment }}

jobs:
  # Every other job needs this one, so no input reaches a build, a tag or
  # an image name unchecked.
  release-inputs:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The same rules release-manifest, android-version-code.sh and
      # release-pointer apply, checked before anything is built or pushed.
      - name: Validate the inputs
        env:
          FIRST_POINTER: ${{ inputs.first-pointer }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] ||
            fail "tag $TAG is not vX.Y.Z or vX.Y.Z-<prerelease>"
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || fail "commit $COMMIT is not a full lowercase SHA"
          [[ $TOOLS_COMMIT =~ ^[0-9a-f]{40}$ ]] || fail "tools commit $TOOLS_COMMIT is not a full lowercase SHA"
          case $CHANNEL in '' | nightly | beta | stable) ;; *) fail "channel $CHANNEL is not nightly, beta or stable" ;; esac
          [[ $BUILD =~ ^(0|[1-9][0-9]*)$ ]] || fail "build $BUILD is not a non-negative integer"
          [[ $HOTFIX =~ ^(0|[1-9][0-9]*)$ ]] || fail "hotfix $HOTFIX is not a non-negative integer"
          [ "$BUILD" -le 19999999 ] || fail "build $BUILD is above 19999999"
          [ "$HOTFIX" -le 99 ] || fail "hotfix $HOTFIX is above 99"
          case $CHANNEL in
          '') [ "$BUILD $HOTFIX" = "0 0" ] || fail "build $BUILD and hotfix $HOTFIX need a channel" ;;
          *)
            [ "$BUILD" -ge 1 ] || fail "channel $CHANNEL needs a positive build"
            if [[ $TAG =~ -nightly\.[1-9][0-9]*$ ]]; then form=nightly
            elif [[ $TAG =~ -beta\.[1-9][0-9]*$ ]]; then form=beta
            elif [[ $TAG == *-* ]]; then form=none
            else form=stable
            fi
            [ "$form" = "$CHANNEL" ] || fail "channel $CHANNEL does not match $TAG"
            ;;
          esac
          case $POINTER in '' | nightly | beta | stable) ;; *) fail "pointer $POINTER is not nightly, beta or stable" ;; esac
          [[ $POINTER_IF_ABOVE =~ ^((nightly|beta|stable)( (nightly|beta|stable))*)?$ ]] ||
            fail "pointer-if-above '$POINTER_IF_ABOVE' is not a space-separated list of nightly, beta and stable"
          read -ra if_above <<<"$POINTER_IF_ABOVE"
          [ "$(printf '%s\n' "$POINTER" "${if_above[@]}" | grep -c .)" = "$(printf '%s\n' "$POINTER" "${if_above[@]}" | grep . | sort -u | wc -l)" ] ||
            fail "pointer '$POINTER' and pointer-if-above '$POINTER_IF_ABOVE' name a channel twice"
          # The release key never signs a nightly, and the nightly key signs
          # nothing else.
          case $SIGNING_ENVIRONMENT:$CHANNEL in
          nightly:nightly) ;;
          nightly:*) fail "the nightly environment and key sign only a nightly release, not a ${CHANNEL:-pre-channel} one" ;;
          release:nightly) fail "a nightly release is signed in the nightly environment with the nightly key, not with the release key" ;;
          release:*) ;;
          *) fail "signing environment $SIGNING_ENVIRONMENT is not release or nightly" ;;
          esac
          for pointer in "$POINTER" "${if_above[@]}"; do
            case $pointer:$CHANNEL in
            :* | stable:stable | beta:beta | beta:stable | nightly:nightly) ;;
            *) fail "a ${CHANNEL:-pre-channel} release cannot be named by $pointer.json" ;;
            esac
          done
          [ "$FIRST_POINTER" = false ] || [ -n "$POINTER" ] || fail "first-pointer needs pointer"
          [ "$PROMOTED" = false ] || [ -n "$CHANNEL" ] || fail "a promoted release needs a channel"

  # Each architecture runs the exact image it publishes on a native headless
  # Ubuntu host. No QEMU or host-installed Chromium changes the sandbox proof.
  browser-image:
    needs: release-inputs
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # No build cache: CI writes this image's caches on Blacksmith runners,
      # and a cache written by other workflows must not reach a published image.
      - name: Build the versioned browser companion
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/browser/Dockerfile
          load: true
          # Off, so a containerd image store cannot add unknown/unknown
          # attestation manifests to what is pushed and joined.
          provenance: false
          sbom: false
          tags: ghcr.io/3xdevops/aether-browser:${{ inputs.tag }}-${{ matrix.arch }}
      - name: Prove sandbox, local app, actions, captures and streams
        env:
          BROWSER_IMAGE: ghcr.io/3xdevops/aether-browser:${{ inputs.tag }}-${{ matrix.arch }}
        run: make browser-smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the already-tested local image, not a second independent build.
      - name: Publish the tested architecture
        env:
          BROWSER_IMAGE: ghcr.io/3xdevops/aether-browser:${{ inputs.tag }}-${{ matrix.arch }}
        run: docker push "$BROWSER_IMAGE"

  browser-manifest:
    needs: browser-image
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the server-version browser manifest
        run: |
          image="ghcr.io/3xdevops/aether-browser:$TAG"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
      # New GHCR packages must be made public by the repository administrator.
      # An authenticated pull alone would ship a companion users cannot fetch.
      - name: Verify tested browser manifests and anonymous pulls
        id: verify
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image=ghcr.io/3xdevops/aether-browser
          digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          index=$(docker buildx imagetools inspect --raw "$image@$digest")
          printf '%s' "$index" | jq -e \
            '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
          docker --config "$config" manifest inspect "$image@$digest" >/dev/null
          for arch in amd64 arm64; do
            platform=$(printf '%s' "$index" | jq -er --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            tested=$(docker buildx imagetools inspect --raw "$image:$TAG-$arch" | jq -r --arg arch "$arch" \
              'if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest else empty end')
            [ -n "$tested" ] || tested=$(docker buildx imagetools inspect "$image:$TAG-$arch" --format '{{.Manifest.Digest}}')
            test "$platform" = "$tested"
            docker --config "$config" pull "$image@$platform"
            pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$platform")
            test "$pulled" = "linux/$arch"
            echo "$arch=$platform" >> "$GITHUB_OUTPUT"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-browser
          subject-digest: ${{ steps.verify.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-browser
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
      - name: Attest linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-browser
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
      - name: Verify the aether-browser attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.verify.outputs.digest }} ${{ steps.verify.outputs.amd64 }} ${{ steps.verify.outputs.arm64 }}
        # The attestation API can answer a moment after the upload.
        run: |
          for digest in $DIGESTS; do
            for attempt in 1 2 3 4 5; do
              gh attestation verify "oci://ghcr.io/3xdevops/aether-browser@$digest" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
                --source-ref "$GITHUB_REF" --deny-self-hosted-runners && continue 2
              [ "$attempt" = 5 ] || sleep 5
            done
            exit 1
          done

  # Each architecture is built, loaded and smoke-tested on a native runner,
  # as browser-image does, and only the tested image is pushed, under an
  # architecture-suffixed tag. edge-manifest then joins them under the
  # immutable tags, and edge-latest moves latest once the release is
  # published. release waits for edge-manifest, so a failed edge image
  # uploads no assets. Every edge job can publish, so its actions are pinned
  # by commit; each pin is the release its major tag named.
  edge-image:
    needs: release-inputs
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          # Full history, as in release, so `git rev-parse --short` picks
          # the same length the Makefile stamps the release binaries with.
          fetch-depth: 0
      - name: Read the short commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Generate edge image labels
        id: edge-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/3xdevops/aether-edge
          tags: type=raw,value=${{ inputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.title=aether-edge
            org.opencontainers.image.description=Aether edge: GitHub sign-in and relay for Aether servers
      # No build cache: the image builds in about a minute, and a cache
      # written by other workflows must not reach a published image.
      - name: Build the edge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/edge/Dockerfile
          load: true
          # Off, so a containerd image store cannot add unknown/unknown
          # attestation manifests to what is pushed and joined.
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ steps.commit.outputs.short }}
            RELEASE_BUILD=${{ inputs.build }}
            RELEASE_HOTFIX=${{ inputs.hotfix }}
          tags: ${{ steps.edge-meta.outputs.tags }}
          labels: ${{ steps.edge-meta.outputs.labels }}
      - name: Smoke-test the edge image
        env:
          EDGE_IMAGE: ghcr.io/3xdevops/aether-edge:${{ inputs.tag }}-${{ matrix.arch }}
        run: sh scripts/edge-image-smoke.sh "$EDGE_IMAGE"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the already-tested local image, not a second independent build.
      - name: Publish the tested architecture
        env:
          EDGE_IMAGE: ghcr.io/3xdevops/aether-edge:${{ inputs.tag }}-${{ matrix.arch }}
        run: docker push "$EDGE_IMAGE"

  edge-manifest:
    needs: [release-inputs, edge-image]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Full history, as in edge-image, so the short commit in the sha- tag
      # is the one `aether-edge version` prints.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read the short commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The architectures were pushed from the runner's image store as
      # Docker manifests, so the joined image is a manifest list, which
      # carries no annotations; each image's labels name the source.
      - name: Generate edge image tags
        id: edge-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/3xdevops/aether-edge
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=${{ inputs.commit }},enable=${{ !inputs.promoted }}
            type=raw,value=sha-${{ steps.commit.outputs.short }},enable=${{ !inputs.promoted }}
      - name: Publish the release manifest
        id: publish
        env:
          TAGS: ${{ steps.edge-meta.outputs.tags }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          set --
          for tag in $TAGS; do
            set -- "$@" --tag "$tag"
          done
          docker buildx imagetools create "$@" "$image:$TAG-amd64" "$image:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Pulls with this job's login: a package GHCR has just created is
      # private until an administrator makes it public.
      - name: Verify and pull both edge image architectures
        id: verify
        env:
          TAGS: ${{ steps.edge-meta.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          for ref in $TAGS; do
            tagged=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$ref is $tagged, not the published $DIGEST"
              exit 1
            fi
          done
          index=$(docker buildx imagetools inspect --raw "$image@$DIGEST")
          {
            echo "### ghcr.io/3xdevops/aether-edge"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Platform | Immutable reference |"
            echo "| --- | --- |"
            for ref in $TAGS; do
              echo "| linux/amd64, linux/arm64 | \`$ref@$DIGEST\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do
            platform=$(printf '%s' "$index" | jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            # The index must carry the image smoke-tested for this
            # architecture, whether that push was a manifest or an index.
            tested=$(docker buildx imagetools inspect --raw "$image:$TAG-$arch" | jq -r --arg arch "$arch" \
              'if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest else empty end')
            [ -n "$tested" ] || tested=$(docker buildx imagetools inspect "$image:$TAG-$arch" --format '{{.Manifest.Digest}}')
            if [ "$platform" != "$tested" ]; then
              echo "::error::$image@$DIGEST carries $platform for linux/$arch, not the smoke-tested $tested"
              exit 1
            fi
            # By its own digest only. The tags and the index were resolved
            # at the registry above, and docker refuses a second pull of
            # one digest for another platform ("cannot overwrite digest"),
            # which failed the v0.5.2-alpha.4 release after its image was
            # published.
            docker pull "$image@$platform"
            pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$platform")
            if [ "$pulled" != "linux/$arch" ]; then
              echo "::error::$image@$platform is $pulled, not linux/$arch"
              exit 1
            fi
            echo "| linux/$arch | \`$image@$platform\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$arch=$platform" >> "$GITHUB_OUTPUT"
          done
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-edge
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-edge
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
      - name: Attest linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-edge
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
      - name: Verify the aether-edge attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.publish.outputs.digest }} ${{ steps.verify.outputs.amd64 }} ${{ steps.verify.outputs.arm64 }}
        # The attestation API can answer a moment after the upload.
        run: |
          for digest in $DIGESTS; do
            for attempt in 1 2 3 4 5; do
              gh attestation verify "oci://ghcr.io/3xdevops/aether-edge@$digest" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
                --source-ref "$GITHUB_REF" --deny-self-hosted-runners && continue 2
              [ "$attempt" = 5 ] || sleep 5
            done
            exit 1
          done
      # Not a release failure: the image is published and pullable with
      # credentials. Until the package is public, users cannot pull it.
      - name: Check anonymous availability of the edge image
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image="ghcr.io/3xdevops/aether-edge:$TAG"
          # Asks the registry without pulling, so nothing the steps above
          # pulled can answer for it.
          # The list, then each architecture's own manifest by digest.
          if out=$(docker --config "$config" manifest inspect "$image" 2>&1) &&
            digests=$(printf '%s' "$out" | jq -er '[.manifests[].digest] | join(" ") | select(length > 0)'); then
            for digest in $digests; do
              out=$(docker --config "$config" manifest inspect "${image%:*}@$digest" 2>&1) || { image="${image%:*}@$digest"; digests=; break; }
            done
          else
            digests=
          fi
          if [ -z "$digests" ]; then
            printf '%s\n' "$out"
            echo "::warning title=aether-edge is not public::$image cannot be read anonymously: $(printf '%s' "$out" | tail -n 1). A repository administrator must open https://github.com/orgs/3xDevOps/packages/container/package/aether-edge, choose Package settings, set Danger Zone > Change visibility to Public, and, if the package page does not show 3xDevOps/aether as its repository, use Connect repository to link it."
          fi

  # make test-edge-upgrade on this commit: from the releases the channel
  # pointers name, then scripts/edge-update.sh through failed and
  # migrating builds of it, in
  # real containers and without a registry outside the runner.
  # promote-edge.yml refuses to promote a release whose run has no
  # successful job of this name.
  edge-qualify:
    needs: release-inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify an edge upgrade
        # A nightly also upgrades from the previous nightly; a release
        # skips a channel whose pointer is above its build and hotfix.
        run: sudo env "PATH=$PATH" "HOME=$HOME" "EDGE_QUALIFY_CHANNEL=$CHANNEL" "EDGE_QUALIFY_BUILD=$BUILD" "EDGE_QUALIFY_HOTFIX=$HOTFIX" make test-edge-upgrade

  release-binaries:
    needs: release-inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
          variant: release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      # Rebuild with the tag's exact version and Windows resources. Main CI's
      # differently versioned binaries are validation evidence, not release assets.
      - name: Build this release platform
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          platform="$TARGET_OS/$TARGET_ARCH"
          linux=
          if [ "$TARGET_OS" = linux ]; then linux=$platform; fi
          make release-binaries VERSION="$TAG" RELEASE_BUILD="$BUILD" RELEASE_HOTFIX="$HOTFIX" \
            SERVER_PLATFORMS="$linux" EDGE_PLATFORMS="$linux" CLI_PLATFORMS="$platform"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The guest kernel session VMs boot, from the pinned container `make kernel`
  # builds in.
  kernel:
    needs: release-inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Build the guest kernel
        run: |
          make kernel
          test -s dist/aether-vmlinux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-kernel
          path: dist/aether-vmlinux-x86_64
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Each architecture packages and launches on a native Windows runner.
  desktop-windows:
    needs: release-inputs
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - id: desktop
        uses: ./.github/actions/desktop-windows-zip
        with:
          version: ${{ inputs.tag }}
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-desktop-windows-${{ matrix.arch }}
          path: ${{ steps.desktop.outputs.zip }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Scan the exact bytes produced for this tag, not the differently versioned
  # main-CI build. Both architectures are required before release publication.
  windows-defender:
    needs: [release-inputs, release-binaries, desktop-windows]
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Arm Defender before downloading release binaries
        shell: powershell
        run: ./scripts/windows-defender.ps1 -Mode Prepare
      # No run-id or token: only this release run's immutable artifacts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-go-windows-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-desktop-windows-*
          merge-multiple: true
          path: dist
      - name: Scan both final Windows clients and desktop apps
        shell: powershell
        run: >-
          ./scripts/windows-defender.ps1 -Mode Scan -ArtifactDirectory dist -Artifacts
          aether-windows-amd64.exe, aether-windows-arm64.exe,
          aether-desktop-windows-amd64.zip, aether-desktop-windows-arm64.zip

  android:
    needs: release-inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No other job receives signing secrets. The first step refuses missing
      # secrets before setup; the key stays outside checkout and is always removed.
      - name: Decode the Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="${missing:+$missing }$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the Android APK and app bundle cannot be signed; these repository secrets are not set: $missing. Set all four (see the Android app section of docs/install.md), then rerun this release."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/aether-android.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle-cache
          key: gradle-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.environment }}-
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # make android verifies APK and AAB signatures against this keystore's
      # SHA-256 fingerprint; a different signer cannot produce an upload.
      - name: Build and verify signed Android packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GRADLE_HOME: ${{ github.workspace }}/.gradle-cache
        run: |
          make android VERSION="$TAG" RELEASE_BUILD="$BUILD" RELEASE_HOTFIX="$HOTFIX"
          test -s dist/aether-android.apk
          test -s dist/aether-android.aab
      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aether-android.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-android
          path: |
            dist/aether-android.apk
            dist/aether-android.aab
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  standard-image:
    needs: release-inputs
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Generate standard image labels
        id: standard-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/3xdevops/aether-standard
          tags: type=raw,value=${{ inputs.tag }}-${{ matrix.arch }}
          labels: org.opencontainers.image.version=${{ inputs.tag }}
      # Native builds retain Ubuntu's normal update behavior without QEMU's
      # arm64 apt cost. Smoke and push use this same loaded image.
      # No build cache: CI writes this image's caches on Blacksmith runners,
      # and a cache written by other workflows must not reach a published image.
      - name: Build the standard environment image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/standard/Dockerfile
          load: true
          # Off, so a containerd image store cannot add unknown/unknown
          # attestation manifests to what is pushed and joined.
          provenance: false
          sbom: false
          tags: ${{ steps.standard-meta.outputs.tags }}
          labels: ${{ steps.standard-meta.outputs.labels }}
      - name: Prove the standard toolchain and native Git
        env:
          STANDARD_IMAGE: ghcr.io/3xdevops/aether-standard:${{ inputs.tag }}-${{ matrix.arch }}
        run: sh scripts/standard-image-smoke.sh "$STANDARD_IMAGE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested architecture
        env:
          STANDARD_IMAGE: ghcr.io/3xdevops/aether-standard:${{ inputs.tag }}-${{ matrix.arch }}
        run: docker push "$STANDARD_IMAGE"

  standard-manifest:
    needs: [release-inputs, standard-image]
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the immutable standard image tags
        id: publish
        run: |
          image=ghcr.io/3xdevops/aether-standard
          # Preserve metadata-action's seven-character sha- tag convention.
          short=${COMMIT:0:7}
          tags=("$TAG" "$COMMIT" "sha-$short")
          if [ "$PROMOTED" = true ]; then tags=("$TAG"); fi
          docker buildx imagetools create \
            "${tags[@]/#/--tag=$image:}" \
            "$image:$TAG-amd64" "$image:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify tested manifest contents and anonymous pulls
        id: verify
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-standard
          short=${COMMIT:0:7}
          tags=("$TAG" "$COMMIT" "sha-$short")
          if [ "$PROMOTED" = true ]; then tags=("$TAG"); fi
          for tag in "${tags[@]}"; do
            tagged=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
            test "$tagged" = "$DIGEST"
          done
          index=$(docker buildx imagetools inspect --raw "$image@$DIGEST")
          printf '%s' "$index" | jq -e \
            '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          # Query the index anonymously, then pull each distinct child digest.
          # Pulling the index twice cannot overwrite one digest's local platform.
          docker --config "$config" manifest inspect "$image@$DIGEST" >/dev/null
          for arch in amd64 arm64; do
            platform=$(printf '%s' "$index" | jq -er --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            tested=$(docker buildx imagetools inspect --raw "$image:$TAG-$arch" | jq -r --arg arch "$arch" \
              'if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest else empty end')
            [ -n "$tested" ] || tested=$(docker buildx imagetools inspect "$image:$TAG-$arch" --format '{{.Manifest.Digest}}')
            test "$platform" = "$tested"
            docker --config "$config" pull "$image@$platform"
            pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$platform")
            test "$pulled" = "linux/$arch"
            echo "Standard linux/$arch: \`$image@$platform\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$arch=$platform" >> "$GITHUB_OUTPUT"
          done
          echo "Standard manifest: \`$image@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-standard
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-standard
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
      - name: Attest linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-standard
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
      - name: Verify the aether-standard attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.publish.outputs.digest }} ${{ steps.verify.outputs.amd64 }} ${{ steps.verify.outputs.arm64 }}
        # The attestation API can answer a moment after the upload.
        run: |
          for digest in $DIGESTS; do
            for attempt in 1 2 3 4 5; do
              gh attestation verify "oci://ghcr.io/3xdevops/aether-standard@$digest" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
                --source-ref "$GITHUB_REF" --deny-self-hosted-runners && continue 2
              [ "$attempt" = 5 ] || sleep 5
            done
            exit 1
          done

  # The store schema and edge section come from the released commit's own
  # code, so they are computed here, away from the signing key.
  release-values:
    needs: [release-inputs, browser-manifest, edge-manifest, standard-manifest]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      store-schema: ${{ steps.store.outputs.schema }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Read the store schema the release migrates to
        id: store
        run: echo "schema=$(go run ./internal/store/cmd/schema-version)" >> "$GITHUB_OUTPUT"
      # From this build and packaging/edge/upgrade.json, which it refuses
      # when stale.
      - name: Write the image digests and edge section the manifest signs
        env:
          BROWSER: ${{ needs.browser-manifest.outputs.digest }}
          EDGE: ${{ needs.edge-manifest.outputs.digest }}
          STANDARD: ${{ needs.standard-manifest.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/values"
          go run ./internal/edge/cmd/release-edge -tag "$TAG" \
            -image "aether-browser=$BROWSER" -image "aether-edge=$EDGE" -image "aether-standard=$STANDARD" \
            > "$RUNNER_TEMP/values/images.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-values
          path: ${{ runner.temp }}/values/images.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The trusted signer. It checks out tools-commit, which must be on main,
  # and runs only its scripts and tools, so a re-run signs with the same
  # tooling as the first attempt. The artifacts are data, checked by name, size and the commit
  # their Go binaries record before anything signs them. No producer may be
  # skipped or failed, and the release stays a draft until it is
  # downloaded back and matches the signed manifest, so installers never
  # see a release without its assets.
  release:
    needs: [release-inputs, release-values, release-binaries, kernel, desktop-windows, windows-defender, android, browser-manifest, edge-manifest, edge-qualify, standard-manifest]
    environment: ${{ inputs.signing-environment }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pointer-if-above-names-release: ${{ steps.if-above.outputs.names }}
    steps:
      # release-manifest and release-pointer read the key from
      # AETHER_RELEASE_SIGNING_KEY; the sign and pointer steps set it to this
      # run's key, which must be the only signing key in reach.
      - name: Require exactly the ${{ inputs.signing-environment }} signing key
        env:
          RELEASE_KEY_SET: ${{ secrets.AETHER_RELEASE_SIGNING_KEY != '' }}
          NIGHTLY_KEY_SET: ${{ secrets.AETHER_NIGHTLY_SIGNING_KEY != '' }}
        run: |
          case $SIGNING_ENVIRONMENT:$RELEASE_KEY_SET:$NIGHTLY_KEY_SET in
          nightly:false:true | release:true:false) ;;
          nightly:*)
            echo "::error::a nightly run needs AETHER_NIGHTLY_SIGNING_KEY in the nightly environment and must not see AETHER_RELEASE_SIGNING_KEY (release key set: $RELEASE_KEY_SET, nightly key set: $NIGHTLY_KEY_SET)"
            exit 1
            ;;
          *)
            echo "::error::a release run needs AETHER_RELEASE_SIGNING_KEY and must not see AETHER_NIGHTLY_SIGNING_KEY (release key set: $RELEASE_KEY_SET, nightly key set: $NIGHTLY_KEY_SET)"
            exit 1
            ;;
          esac
      - name: Require the tools commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TOOLS_COMMIT...main" --jq .status)
          case $status in
          ahead | identical) ;;
          *)
            echo "::error::tools commit $TOOLS_COMMIT is not on main (main is $status of it)"
            exit 1
            ;;
          esac
          echo "Signed and published with the tools of main commit \`$TOOLS_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tools-commit }}
          persist-credentials: false
      # Re-running this job alone skips promote.yml's admin checks, so
      # whoever starts this attempt must be an admin too.
      - name: Require an admin
        if: inputs.promoted
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/require-admin.sh "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      # Outside the checkout, so no artifact can stand in for main's files.
      # No run-id or token: download-artifact can read only this workflow run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-go-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-android
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-kernel
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-desktop-windows-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-values
          path: ${{ runner.temp }}/values
      - name: Require all fifteen release assets, built from the commit
        working-directory: ${{ runner.temp }}/dist
        run: |
          go_binaries=(
            aether-server-linux-amd64 aether-server-linux-arm64
            aether-edge-linux-amd64 aether-edge-linux-arm64
            aether-linux-amd64 aether-linux-arm64
            aether-darwin-amd64 aether-darwin-arm64
            aether-windows-amd64.exe aether-windows-arm64.exe
          )
          assets=(
            "${go_binaries[@]}"
            aether-desktop-windows-amd64.zip aether-desktop-windows-arm64.zip
            aether-android.apk aether-android.aab
            aether-vmlinux-x86_64
          )
          # Reject unsigned Android names, unexpected files/directories and
          # missing assets rather than globbing a partial build into a release.
          diff -u <(printf '%s\n' "${assets[@]}" | sort) \
            <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          for asset in "${assets[@]}"; do
            test -f "$asset" && test -s "$asset" && test ! -L "$asset"
            size=$(stat -c %s "$asset")
            if [ "$size" -gt 536870912 ]; then
              echo "::error::$asset is $size bytes, above the 512 MiB any release asset may be"
              exit 1
            fi
          done
          # go version -m reads the build info; it does not run the binary.
          for asset in "${go_binaries[@]}"; do
            revision=$(go version -m "$asset" | awk '$1 == "build" && $2 ~ /^vcs\.revision=/ { sub(/^vcs\.revision=/, "", $2); print $2 }')
            if [ "$revision" != "$COMMIT" ]; then
              echo "::error::$asset was built from ${revision:-an unknown commit}, not $COMMIT"
              exit 1
            fi
          done
      - name: Require the release values
        working-directory: ${{ runner.temp }}/values
        env:
          STORE_SCHEMA: ${{ needs.release-values.outputs.store-schema }}
        run: |
          [[ $STORE_SCHEMA =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::store schema $STORE_SCHEMA is not a positive integer"; exit 1; }
          diff -u <(echo images.json) <(find . -mindepth 1 -maxdepth 1 -printf '%f\n')
          test -f images.json && test ! -L images.json
          size=$(stat -c %s images.json)
          if [ "$size" -gt 65536 ]; then
            echo "::error::images.json is $size bytes, above 64 KiB"
            exit 1
          fi
      # Only now, so a run that fails earlier leaves no tag; a re-run finds
      # the tag it created and goes on.
      - name: Create the release tag
        if: inputs.promoted || inputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/create-release-tag.sh "$TAG" "$COMMIT" "$BUILD"
      - name: Require the tag to name the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$tagged" != "$COMMIT" ]; then
            echo "::error::tag $TAG names $tagged; this run built $COMMIT"
            exit 1
          fi
      # After the downloads, so nothing they wrote can replace the tool.
      - name: Build the tools commit's release-manifest and release-pointer
        run: |
          go build -o "$RUNNER_TEMP/release-manifest" ./internal/selfupdate/cmd/release-manifest
          go build -o "$RUNNER_TEMP/release-pointer" ./scripts/release-pointer
      - name: Write checksums and sign the manifest
        working-directory: ${{ runner.temp }}/dist
        env:
          AETHER_RELEASE_SIGNING_KEY: ${{ inputs.signing-environment == 'nightly' && secrets.AETHER_NIGHTLY_SIGNING_KEY || secrets.AETHER_RELEASE_SIGNING_KEY }}
          STORE_SCHEMA: ${{ needs.release-values.outputs.store-schema }}
        run: |
          assets=(*)
          sha256sum "${assets[@]}" > checksums.txt
          sha256sum --check --strict checksums.txt
          order=()
          if [ -n "$CHANNEL" ]; then
            order=(-channel "$CHANNEL" -build "$BUILD" -hotfix "$HOTFIX")
          fi
          "$RUNNER_TEMP/release-manifest" \
            -version "$TAG" -commit "$COMMIT" -store-schema "$STORE_SCHEMA" "${order[@]}" \
            -images "$RUNNER_TEMP/values/images.json" -out . "${assets[@]}"
          diff -u <(printf '%s\n' "${assets[@]}" checksums.txt aether-release.json aether-release.json.sig | sort) \
            <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/publish-release.sh "$TAG" "$RUNNER_TEMP/dist"
      # Each signed pair is kept as the pointer-<channel> artifact, the pair
      # an admin restores when an upload leaves channels with half of one.
      - name: Move the channel pointer
        if: inputs.pointer != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_SIGNING_KEY: ${{ inputs.signing-environment == 'nightly' && secrets.AETHER_NIGHTLY_SIGNING_KEY || secrets.AETHER_RELEASE_SIGNING_KEY }}
          RELEASE_POINTER: ${{ runner.temp }}/release-pointer
          FIRST_POINTER: ${{ inputs.first-pointer }}
        run: |
          first=()
          if [ "$FIRST_POINTER" = true ]; then first=(--first); fi
          mkdir "$RUNNER_TEMP/pointer-$POINTER"
          sh scripts/publish-pointer.sh "${first[@]}" "$POINTER" "$TAG" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/pointer-$POINTER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && inputs.pointer != '' }}
        with:
          name: pointer-${{ inputs.pointer }}
          path: ${{ runner.temp }}/pointer-${{ inputs.pointer }}/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
      - name: Move the channel pointers the release is above
        id: if-above
        if: inputs.pointer-if-above != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_SIGNING_KEY: ${{ inputs.signing-environment == 'nightly' && secrets.AETHER_NIGHTLY_SIGNING_KEY || secrets.AETHER_RELEASE_SIGNING_KEY }}
          RELEASE_POINTER: ${{ runner.temp }}/release-pointer
          FIRST_POINTER: ${{ inputs.first-pointer }}
        run: |
          first=()
          if [ "$FIRST_POINTER" = true ]; then first=(--first); fi
          names=true
          mkdir "$RUNNER_TEMP/if-above-now"
          read -ra if_above <<<"$POINTER_IF_ABOVE"
          for channel in "${if_above[@]}"; do
            mkdir "$RUNNER_TEMP/pointer-$channel"
            sh scripts/publish-pointer.sh "${first[@]}" --if-above "$channel" "$TAG" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/pointer-$channel"
            # Also when an earlier attempt moved it: the pointer
            # publish-pointer.sh just verified, or wrote, names this tag.
            gh release download channels --pattern "$channel.json" --dir "$RUNNER_TEMP/if-above-now"
            if [ "$(jq -r .tag "$RUNNER_TEMP/if-above-now/$channel.json")" != "$TAG" ]; then names=false; fi
          done
          echo "names=$names" >> "$GITHUB_OUTPUT"
      # Only beta and stable can be listed: this workflow never signs
      # nightly.json.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && contains(format(' {0} ', inputs.pointer-if-above), ' stable ') }}
        with:
          name: pointer-stable
          path: ${{ runner.temp }}/pointer-stable/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && contains(format(' {0} ', inputs.pointer-if-above), ' beta ') }}
        with:
          name: pointer-beta
          path: ${{ runner.temp }}/pointer-beta/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

  # latest moves only after the release is published, to the index
  # edge-manifest already pushed, so a release that fails earlier leaves it
  # where it was and nothing is rebuilt. It moves only while this tag is
  # GitHub's Latest, checked when the job runs, so a re-run of an older
  # release never moves it back.
  edge-latest:
    needs: [edge-manifest, release]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require this release to be GitHub's Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "edge latest stays: GitHub's Latest is $latest, not $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install crane
        if: steps.latest.outputs.move == 'true'
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.latest.outputs.move == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest to the published edge image
        if: steps.latest.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.edge-manifest.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          # crane tag writes the index's own bytes under latest, so latest
          # has the digest the release signed and attested.
          crane tag "$image@$DIGEST" latest
          moved=$(crane digest "$image:latest")
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::$image:latest is $moved, not the published $DIGEST"
            exit 1
          fi
          # A parallel release can take Latest after the check above; the
          # move may then have overwritten its image.
          now=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$now" != "$TAG" ]; then
            echo "::error::GitHub's Latest moved to $now while $image:latest moved to $TAG; re-run the latest jobs of the $now release"
            exit 1
          fi
          echo "$image:latest is $TAG, \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  standard-latest:
    needs: [standard-manifest, release]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require this release to be GitHub's Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "standard latest stays: GitHub's Latest is $latest, not $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install crane
        if: steps.latest.outputs.move == 'true'
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.latest.outputs.move == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest to the published standard image
        if: steps.latest.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.standard-manifest.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-standard
          crane tag "$image@$DIGEST" latest
          moved=$(crane digest "$image:latest")
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::$image:latest is $moved, not the published $DIGEST"
            exit 1
          fi
          # A parallel release can take Latest after the check above; the
          # move may then have overwritten its image.
          now=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$now" != "$TAG" ]; then
            echo "::error::GitHub's Latest moved to $now while $image:latest moved to $TAG; re-run the latest jobs of the $now release"
            exit 1
          fi
          echo "$image:latest is $TAG, \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"