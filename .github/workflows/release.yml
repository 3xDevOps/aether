name: Release

# Pushing a release tag starts the trusted release workflow. Tag-sourced
# builds run only after publisher and exact-commit CI authorization;
# release-build.yml builds, signs and publishes them. A hotfix tag vX.Y.Z
# (Z at least 1) must be on release/X.Y and becomes a stable release with
# the build of the stable it fixes; any other tag must be on main and
# releases with no channel, as before channels. A -nightly.N tag is refused.
on:
  push:
    tags: ['v*']

permissions: {}

defaults:
  run:
    shell: bash

# One run per tag at a time; different tags run in parallel. GitHub keeps
# one pending run per group and cancels older pending ones, so a shared group
# would silently drop a release. publish-release.sh recomputes Latest after
# every publish, and the image latest jobs follow GitHub's Latest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publisher-policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.select.outputs.allowed }}
    steps:
      - name: Check the publisher
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps the pusher as GITHUB_ACTOR, so whoever started this
        # attempt must be an admin too.
        run: |
          allowed=true
          for user in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission=$(gh api \
              "repos/${GITHUB_REPOSITORY}/collaborators/${user}/permission" \
              --jq '.permission' 2>/dev/null || true)
            # A failed lookup deliberately disables the release.
            if [ "$permission" != admin ]; then
              allowed=false
            fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  # Fails before anything is built or pushed. Only a job in the release
  # environment sees its secrets; environment secrets resolve before
  # repository secrets, so the key may live in either. CONTRIBUTING.md,
  # Set up releases, and docs/security.md, Release signing.
  signing-key:
    needs: publisher-policy
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    environment: release
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the release signing key
        env:
          KEY_SET: ${{ secrets.AETHER_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::the release manifest cannot be signed; AETHER_RELEASE_SIGNING_KEY is set neither in the release environment nor as a repository secret. Set it (see Release signing in docs/security.md), then rerun this release."
            exit 1
          fi

  # This is the only validation reuse boundary. The tag is resolved once and
  # every producer checks out that commit, never an unsigned CI artifact.
  release-policy:
    needs: [publisher-policy, signing-key]
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      tools: ${{ steps.authorize.outputs.tools }}
      channel: ${{ steps.authorize.outputs.channel }}
      build: ${{ steps.authorize.outputs.build }}
      hotfix: ${{ steps.authorize.outputs.hotfix }}
      pointer-if-above: ${{ steps.authorize.outputs.pointer-if-above }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Read policy scripts from trusted main before executing tag code.
          # workflow_sha names the tag revision on a tag push.
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate the release tag and exact CI commit
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$GITHUB_REF^{commit}")
          test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          path=$(sh scripts/release-tag-path.sh "$GITHUB_REF_NAME")
          if [ "$path" = hotfix ]; then
            go build -o "$RUNNER_TEMP/release-hotfix" ./scripts/release-hotfix
            RELEASE_HOTFIX="$RUNNER_TEMP/release-hotfix" sh scripts/release-hotfix.sh \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$sha" >"$RUNNER_TEMP/hotfix"
            build=$(sed -n 's/^build=//p' "$RUNNER_TEMP/hotfix")
            hotfix=$(sed -n 's/^hotfix=//p' "$RUNNER_TEMP/hotfix")
            base=$(sed -n 's/^base-tag=//p' "$RUNNER_TEMP/hotfix")
            sh scripts/android-version-code.sh "$GITHUB_REF_NAME" "$build" "$hotfix"
            core=${GITHUB_REF_NAME#v}
            branch=release/${core%.*}
            url=$(sh scripts/release-ci-check.sh --branch "$branch" "$GITHUB_REPOSITORY" "$sha")
            printf '%s\n' channel=stable "build=$build" "hotfix=$hotfix" 'pointer-if-above=beta stable' >> "$GITHUB_OUTPUT"
            echo "Hotfix $GITHUB_REF_NAME of $base: stable, build $build, hotfix $hotfix, on \`$branch\`; moves beta.json, then stable.json, each only if the hotfix is above it" >> "$GITHUB_STEP_SUMMARY"
          else
            sh scripts/android-version-code.sh "$GITHUB_REF_NAME"
            url=$(sh scripts/release-ci-check.sh "$GITHUB_REPOSITORY" "$sha")
            branch=main
            printf '%s\n' channel= build=0 hotfix=0 pointer-if-above= >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tools=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release validation: $url (exact $branch commit \`$sha\`)" >> "$GITHUB_STEP_SUMMARY"

  # Every job in release-build.yml gets at most these permissions and
  # narrows them to what it needs. Its release job runs in the release
  # environment, whose signing key takes precedence over the repository
  # secret passed here. A hotfix, which may move pointers, waits for the
  # channels group every pointer writer shares; the other group is never
  # contended and only stands in, since a group cannot be empty.
  release-build:
    needs: release-policy
    concurrency:
      group: ${{ needs.release-policy.outputs.pointer-if-above != '' && 'channels' || format('release-build-{0}', github.ref) }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.ref_name }}
      commit: ${{ needs.release-policy.outputs.sha }}
      tools-commit: ${{ needs.release-policy.outputs.tools }}
      channel: ${{ needs.release-policy.outputs.channel }}
      build: ${{ fromJSON(needs.release-policy.outputs.build) }}
      hotfix: ${{ fromJSON(needs.release-policy.outputs.hotfix) }}
      pointer-if-above: ${{ needs.release-policy.outputs.pointer-if-above }}
    secrets:
      AETHER_RELEASE_SIGNING_KEY: ${{ secrets.AETHER_RELEASE_SIGNING_KEY }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
