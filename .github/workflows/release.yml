name: Release

# Pushing a release tag starts the trusted release workflow. Tag-sourced
# builds run only after publisher and exact-main-CI authorization, and the
# GitHub release stays a draft until every asset is uploaded and verified.
on:
  push:
    tags: ['v*']

permissions: {}

defaults:
  run:
    shell: bash

# One run per tag at a time; different tags run in parallel. GitHub keeps
# one pending run per group and cancels older pending ones, so a shared group
# would silently drop a release. publish-release.sh recomputes Latest after
# every publish, and the image latest jobs follow GitHub's Latest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publisher-policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.select.outputs.allowed }}
    steps:
      - name: Check the publisher
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps the pusher as GITHUB_ACTOR, so whoever started this
        # attempt must be an admin too.
        run: |
          allowed=true
          for user in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission=$(gh api \
              "repos/${GITHUB_REPOSITORY}/collaborators/${user}/permission" \
              --jq '.permission' 2>/dev/null || true)
            # A failed lookup deliberately disables the release.
            if [ "$permission" != admin ]; then
              allowed=false
            fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  # Fails before anything is built or pushed. Only a job in the release
  # environment sees its secrets; environment secrets resolve before
  # repository secrets, so the key may live in either. docs/install.md,
  # Protecting the signing key.
  signing-key:
    needs: publisher-policy
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    environment: release
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the release signing key
        env:
          KEY_SET: ${{ secrets.AETHER_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::the release manifest cannot be signed; AETHER_RELEASE_SIGNING_KEY is set neither in the release environment nor as a repository secret. Set it (see Release signing in docs/security.md), then rerun this release."
            exit 1
          fi

  # This is the only validation reuse boundary. The tag is resolved once and
  # every producer checks out that commit, never an unsigned CI artifact.
  release-policy:
    needs: [publisher-policy, signing-key]
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Read policy scripts from trusted main before executing tag code.
          # workflow_sha names the tag revision on a tag push.
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the release tag and exact main CI commit
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/android-version-code.sh "$GITHUB_REF_NAME"
          sha=$(git rev-parse "$GITHUB_REF^{commit}")
          test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          url=$(sh scripts/release-ci-check.sh "$GITHUB_REPOSITORY" "$sha")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release validation: $url (exact main commit \`$sha\`)" >> "$GITHUB_STEP_SUMMARY"

  # Each architecture runs the exact image it publishes on a native headless
  # Ubuntu host. No QEMU or host-installed Chromium changes the sandbox proof.
  browser-image:
    needs: release-policy
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the versioned browser companion
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/browser/Dockerfile
          load: true
          # Off, so a containerd image store cannot add unknown/unknown
          # attestation manifests to what is pushed and joined.
          provenance: false
          sbom: false
          tags: ghcr.io/3xdevops/aether-browser:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}-main
      - name: Prove sandbox, local app, actions, captures and streams
        env:
          BROWSER_IMAGE: ghcr.io/3xdevops/aether-browser:${{ github.ref_name }}-${{ matrix.arch }}
        run: make browser-smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the already-tested local image, not a second independent build.
      - name: Publish the tested architecture
        env:
          BROWSER_IMAGE: ghcr.io/3xdevops/aether-browser:${{ github.ref_name }}-${{ matrix.arch }}
        run: docker push "$BROWSER_IMAGE"

  browser-manifest:
    needs: browser-image
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the server-version browser manifest
        run: |
          image="ghcr.io/3xdevops/aether-browser:$GITHUB_REF_NAME"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
      # New GHCR packages must be made public by the repository administrator.
      # An authenticated pull alone would ship a companion users cannot fetch.
      - name: Verify tested browser manifests and anonymous pulls
        id: verify
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image=ghcr.io/3xdevops/aether-browser
          digest=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          index=$(docker buildx imagetools inspect --raw "$image@$digest")
          printf '%s' "$index" | jq -e \
            '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
          docker --config "$config" manifest inspect "$image@$digest" >/dev/null
          for arch in amd64 arm64; do
            platform=$(printf '%s' "$index" | jq -er --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            tested=$(docker buildx imagetools inspect --raw "$image:$GITHUB_REF_NAME-$arch" | jq -r --arg arch "$arch" \
              'if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest else empty end')
            [ -n "$tested" ] || tested=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME-$arch" --format '{{.Manifest.Digest}}')
            test "$platform" = "$tested"
            docker --config "$config" pull "$image@$platform"
            pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$platform")
            test "$pulled" = "linux/$arch"
            echo "$arch=$platform" >> "$GITHUB_OUTPUT"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-browser
          subject-digest: ${{ steps.verify.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-browser
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
      - name: Attest linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-browser
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
      - name: Verify the aether-browser attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.verify.outputs.digest }} ${{ steps.verify.outputs.amd64 }} ${{ steps.verify.outputs.arm64 }}
        # The attestation API can answer a moment after the upload.
        run: |
          for digest in $DIGESTS; do
            for attempt in 1 2 3 4 5; do
              gh attestation verify "oci://ghcr.io/3xdevops/aether-browser@$digest" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" --deny-self-hosted-runners && continue 2
              [ "$attempt" = 5 ] || sleep 5
            done
            exit 1
          done

  # Each architecture is built, loaded and smoke-tested on a native runner,
  # as browser-image does, and only the tested image is pushed, under an
  # architecture-suffixed tag. edge-manifest then joins them under the
  # immutable tags, and edge-latest moves latest once the release is
  # published. release waits for edge-manifest, so a failed edge image
  # uploads no assets. Every edge job can publish, so its actions are pinned
  # by commit; each pin is the release its major tag named.
  edge-image:
    needs: release-policy
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
          # Full history, as in release, so `git rev-parse --short` picks
          # the same length the Makefile stamps the release binaries with.
          fetch-depth: 0
      - name: Read the short commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Generate edge image labels
        id: edge-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/3xdevops/aether-edge
          tags: type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=aether-edge
            org.opencontainers.image.description=Aether edge: GitHub sign-in and relay for Aether servers
      # No build cache: the image builds in about a minute, and a cache
      # written by other workflows must not reach a published image.
      - name: Build the edge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/edge/Dockerfile
          load: true
          # Off, so a containerd image store cannot add unknown/unknown
          # attestation manifests to what is pushed and joined.
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.commit.outputs.short }}
          tags: ${{ steps.edge-meta.outputs.tags }}
          labels: ${{ steps.edge-meta.outputs.labels }}
      - name: Smoke-test the edge image
        env:
          EDGE_IMAGE: ghcr.io/3xdevops/aether-edge:${{ github.ref_name }}-${{ matrix.arch }}
        run: sh scripts/edge-image-smoke.sh "$EDGE_IMAGE"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the already-tested local image, not a second independent build.
      - name: Publish the tested architecture
        env:
          EDGE_IMAGE: ghcr.io/3xdevops/aether-edge:${{ github.ref_name }}-${{ matrix.arch }}
        run: docker push "$EDGE_IMAGE"

  edge-manifest:
    needs: [release-policy, edge-image]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Full history, as in edge-image, so the short commit in the sha- tag
      # is the one `aether-edge version` prints.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read the short commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The architectures were pushed from the runner's image store as
      # Docker manifests, so the joined image is a manifest list, which
      # carries no annotations; each image's labels name the source.
      - name: Generate edge image tags
        id: edge-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/3xdevops/aether-edge
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.sha }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      - name: Publish the release manifest
        id: publish
        env:
          TAGS: ${{ steps.edge-meta.outputs.tags }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          set --
          for tag in $TAGS; do
            set -- "$@" --tag "$tag"
          done
          docker buildx imagetools create "$@" "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
          digest=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Pulls with this job's login: a package GHCR has just created is
      # private until an administrator makes it public.
      - name: Verify and pull both edge image architectures
        id: verify
        env:
          TAGS: ${{ steps.edge-meta.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          for ref in $TAGS; do
            tagged=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$ref is $tagged, not the published $DIGEST"
              exit 1
            fi
          done
          index=$(docker buildx imagetools inspect --raw "$image@$DIGEST")
          {
            echo "### ghcr.io/3xdevops/aether-edge"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Platform | Immutable reference |"
            echo "| --- | --- |"
            for ref in $TAGS; do
              echo "| linux/amd64, linux/arm64 | \`$ref@$DIGEST\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do
            platform=$(printf '%s' "$index" | jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            # The index must carry the image smoke-tested for this
            # architecture, whether that push was a manifest or an index.
            tested=$(docker buildx imagetools inspect --raw "$image:$GITHUB_REF_NAME-$arch" | jq -r --arg arch "$arch" \
              'if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest else empty end')
            [ -n "$tested" ] || tested=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME-$arch" --format '{{.Manifest.Digest}}')
            if [ "$platform" != "$tested" ]; then
              echo "::error::$image@$DIGEST carries $platform for linux/$arch, not the smoke-tested $tested"
              exit 1
            fi
            # By its own digest only. The tags and the index were resolved
            # at the registry above, and docker refuses a second pull of
            # one digest for another platform ("cannot overwrite digest"),
            # which failed the v0.5.2-alpha.4 release after its image was
            # published.
            docker pull "$image@$platform"
            pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$platform")
            if [ "$pulled" != "linux/$arch" ]; then
              echo "::error::$image@$platform is $pulled, not linux/$arch"
              exit 1
            fi
            echo "| linux/$arch | \`$image@$platform\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$arch=$platform" >> "$GITHUB_OUTPUT"
          done
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-edge
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-edge
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
      - name: Attest linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-edge
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
      - name: Verify the aether-edge attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.publish.outputs.digest }} ${{ steps.verify.outputs.amd64 }} ${{ steps.verify.outputs.arm64 }}
        # The attestation API can answer a moment after the upload.
        run: |
          for digest in $DIGESTS; do
            for attempt in 1 2 3 4 5; do
              gh attestation verify "oci://ghcr.io/3xdevops/aether-edge@$digest" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" --deny-self-hosted-runners && continue 2
              [ "$attempt" = 5 ] || sleep 5
            done
            exit 1
          done
      # Not a release failure: the image is published and pullable with
      # credentials. Until the package is public, users cannot pull it.
      - name: Check anonymous availability of the edge image
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image="ghcr.io/3xdevops/aether-edge:$GITHUB_REF_NAME"
          # Asks the registry without pulling, so nothing the steps above
          # pulled can answer for it.
          # The list, then each architecture's own manifest by digest.
          if out=$(docker --config "$config" manifest inspect "$image" 2>&1) &&
            digests=$(printf '%s' "$out" | jq -er '[.manifests[].digest] | join(" ") | select(length > 0)'); then
            for digest in $digests; do
              out=$(docker --config "$config" manifest inspect "${image%:*}@$digest" 2>&1) || { image="${image%:*}@$digest"; digests=; break; }
            done
          else
            digests=
          fi
          if [ -z "$digests" ]; then
            printf '%s\n' "$out"
            echo "::warning title=aether-edge is not public::$image cannot be read anonymously: $(printf '%s' "$out" | tail -n 1). A repository administrator must open https://github.com/orgs/3xDevOps/packages/container/package/aether-edge, choose Package settings, set Danger Zone > Change visibility to Public, and, if the package page does not show 3xDevOps/aether as its repository, use Connect repository to link it."
          fi

  release-binaries:
    needs: release-policy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
          variant: release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - uses: ./.github/actions/bun-cache
        with:
          mode: restore
      # Rebuild with the tag's exact version and Windows resources. Main CI's
      # differently versioned binaries are validation evidence, not release assets.
      - name: Build this release platform
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          platform="$TARGET_OS/$TARGET_ARCH"
          linux=
          if [ "$TARGET_OS" = linux ]; then linux=$platform; fi
          make release-binaries VERSION="$GITHUB_REF_NAME" \
            SERVER_PLATFORMS="$linux" EDGE_PLATFORMS="$linux" CLI_PLATFORMS="$platform"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Each architecture packages and launches on a native Windows runner.
  desktop-windows:
    needs: release-policy
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
      - id: desktop
        uses: ./.github/actions/desktop-windows-zip
        with:
          version: ${{ github.ref_name }}
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-desktop-windows-${{ matrix.arch }}
          path: ${{ steps.desktop.outputs.zip }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Scan the exact bytes produced for this tag, not the differently versioned
  # main-CI build. Both architectures are required before release publication.
  windows-defender:
    needs: [release-policy, release-binaries, desktop-windows]
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
      - name: Arm Defender before downloading release binaries
        shell: powershell
        run: ./scripts/windows-defender.ps1 -Mode Prepare
      # No run-id or token: only this release run's immutable artifacts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-go-windows-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-desktop-windows-*
          merge-multiple: true
          path: dist
      - name: Scan both final Windows clients and desktop apps
        shell: powershell
        run: >-
          ./scripts/windows-defender.ps1 -Mode Scan -ArtifactDirectory dist -Artifacts
          aether-windows-amd64.exe, aether-windows-arm64.exe,
          aether-desktop-windows-amd64.zip, aether-desktop-windows-arm64.zip

  android:
    needs: release-policy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No other job receives signing secrets. The first step refuses missing
      # secrets before setup; the key stays outside checkout and is always removed.
      - name: Decode the Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="${missing:+$missing }$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the Android APK and app bundle cannot be signed; these repository secrets are not set: $missing. Set all four (see the Android app section of docs/install.md), then rerun this release."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/aether-android.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle-cache
          key: gradle-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.environment }}-
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # make android verifies APK and AAB signatures against this keystore's
      # SHA-256 fingerprint; a different signer cannot produce an upload.
      - name: Build and verify signed Android packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GRADLE_HOME: ${{ github.workspace }}/.gradle-cache
        run: |
          make android VERSION="$GITHUB_REF_NAME"
          test -s dist/aether-android.apk
          test -s dist/aether-android.aab
      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aether-android.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-android
          path: |
            dist/aether-android.apk
            dist/aether-android.aab
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  standard-image:
    needs: release-policy
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Generate standard image labels
        id: standard-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/3xdevops/aether-standard
          tags: type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
      # Native builds retain Ubuntu's normal update behavior without QEMU's
      # arm64 apt cost. Smoke and push use this same loaded image.
      - name: Build the standard environment image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/standard/Dockerfile
          load: true
          # Off, so a containerd image store cannot add unknown/unknown
          # attestation manifests to what is pushed and joined.
          provenance: false
          sbom: false
          tags: ${{ steps.standard-meta.outputs.tags }}
          labels: ${{ steps.standard-meta.outputs.labels }}
          cache-from: type=gha,scope=standard-${{ matrix.arch }}-main
      - name: Prove the standard toolchain and native Git
        env:
          STANDARD_IMAGE: ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}-${{ matrix.arch }}
        run: sh scripts/standard-image-smoke.sh "$STANDARD_IMAGE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested architecture
        env:
          STANDARD_IMAGE: ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}-${{ matrix.arch }}
        run: docker push "$STANDARD_IMAGE"

  standard-manifest:
    needs: [release-policy, standard-image]
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the immutable standard image tags
        id: publish
        env:
          COMMIT: ${{ needs.release-policy.outputs.sha }}
        run: |
          image=ghcr.io/3xdevops/aether-standard
          # Preserve metadata-action's seven-character sha- tag convention.
          short=${COMMIT:0:7}
          docker buildx imagetools create \
            --tag "$image:$GITHUB_REF_NAME" --tag "$image:$COMMIT" --tag "$image:sha-$short" \
            "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
          digest=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify tested manifest contents and anonymous pulls
        id: verify
        env:
          COMMIT: ${{ needs.release-policy.outputs.sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-standard
          short=${COMMIT:0:7}
          for tag in "$GITHUB_REF_NAME" "$COMMIT" "sha-$short"; do
            tagged=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
            test "$tagged" = "$DIGEST"
          done
          index=$(docker buildx imagetools inspect --raw "$image@$DIGEST")
          printf '%s' "$index" | jq -e \
            '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          # Query the index anonymously, then pull each distinct child digest.
          # Pulling the index twice cannot overwrite one digest's local platform.
          docker --config "$config" manifest inspect "$image@$DIGEST" >/dev/null
          for arch in amd64 arm64; do
            platform=$(printf '%s' "$index" | jq -er --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            tested=$(docker buildx imagetools inspect --raw "$image:$GITHUB_REF_NAME-$arch" | jq -r --arg arch "$arch" \
              'if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest else empty end')
            [ -n "$tested" ] || tested=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME-$arch" --format '{{.Manifest.Digest}}')
            test "$platform" = "$tested"
            docker --config "$config" pull "$image@$platform"
            pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$platform")
            test "$pulled" = "linux/$arch"
            echo "Standard linux/$arch: \`$image@$platform\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$arch=$platform" >> "$GITHUB_OUTPUT"
          done
          echo "Standard manifest: \`$image@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-standard
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-standard
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
      - name: Attest linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/3xdevops/aether-standard
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
      - name: Verify the aether-standard attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: ${{ steps.publish.outputs.digest }} ${{ steps.verify.outputs.amd64 }} ${{ steps.verify.outputs.arm64 }}
        # The attestation API can answer a moment after the upload.
        run: |
          for digest in $DIGESTS; do
            for attempt in 1 2 3 4 5; do
              gh attestation verify "oci://ghcr.io/3xdevops/aether-standard@$digest" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" --deny-self-hosted-runners && continue 2
              [ "$attempt" = 5 ] || sleep 5
            done
            exit 1
          done

  # No producer may be skipped/failed: the complete run-specific asset set and
  # every tested image must be ready before the release is drafted. It is
  # published only after the draft is downloaded back and matches the
  # signed manifest, so installers never see a release without its assets.
  release:
    needs: [release-policy, release-binaries, desktop-windows, windows-defender, android, browser-manifest, edge-manifest, standard-manifest]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-policy.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      # No run-id or token: download-artifact can read only this workflow run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-go-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-android
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-desktop-windows-*
          merge-multiple: true
          path: dist
      # Runs without the signing key, so the signer never links the store.
      - name: Read the store schema the release migrates to
        id: store
        run: echo "schema=$(go run ./internal/store/cmd/schema-version)" >> "$GITHUB_OUTPUT"
      # Also without the key: the image digests, and the edge section from
      # this build and packaging/edge/upgrade.json, which it refuses when stale.
      - name: Write the image digests and edge section the manifest signs
        env:
          BROWSER: ${{ needs.browser-manifest.outputs.digest }}
          EDGE: ${{ needs.edge-manifest.outputs.digest }}
          STANDARD: ${{ needs.standard-manifest.outputs.digest }}
        run: |
          go run ./internal/edge/cmd/release-edge -tag "$GITHUB_REF_NAME" \
            -image "aether-browser=$BROWSER" -image "aether-edge=$EDGE" -image "aether-standard=$STANDARD" \
            > "$RUNNER_TEMP/images.json"
      - name: Require all fourteen release assets, write checksums and sign the manifest
        working-directory: dist
        env:
          AETHER_RELEASE_SIGNING_KEY: ${{ secrets.AETHER_RELEASE_SIGNING_KEY }}
          COMMIT: ${{ needs.release-policy.outputs.sha }}
          STORE_SCHEMA: ${{ steps.store.outputs.schema }}
        run: |
          assets=(
            aether-server-linux-amd64 aether-server-linux-arm64
            aether-edge-linux-amd64 aether-edge-linux-arm64
            aether-linux-amd64 aether-linux-arm64
            aether-darwin-amd64 aether-darwin-arm64
            aether-windows-amd64.exe aether-windows-arm64.exe
            aether-desktop-windows-amd64.zip aether-desktop-windows-arm64.zip
            aether-android.apk aether-android.aab
          )
          # Reject unsigned Android names, unexpected files/directories and
          # missing assets rather than globbing a partial build into a release.
          diff -u <(printf '%s\n' "${assets[@]}" | sort) \
            <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          for asset in "${assets[@]}"; do
            test -f "$asset" && test -s "$asset" && test ! -L "$asset"
          done
          sha256sum "${assets[@]}" > checksums.txt
          sha256sum --check --strict checksums.txt
          go run ../internal/selfupdate/cmd/release-manifest \
            -version "$GITHUB_REF_NAME" -commit "$COMMIT" -store-schema "$STORE_SCHEMA" \
            -images "$RUNNER_TEMP/images.json" -out . "${assets[@]}"
          diff -u <(printf '%s\n' "${assets[@]}" checksums.txt aether-release.json aether-release.json.sig | sort) \
            <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.release-policy.outputs.sha }}
        run: sh scripts/publish-release.sh "$GITHUB_REF_NAME" dist

  # latest moves only after the release is published, to the index
  # edge-manifest already pushed, so a release that fails earlier leaves it
  # where it was and nothing is rebuilt. It moves only while this tag is
  # GitHub's Latest, checked when the job runs, so a re-run of an older
  # release never moves it back.
  edge-latest:
    needs: [edge-manifest, release]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require this release to be GitHub's Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "edge latest stays: GitHub's Latest is $latest, not $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install crane
        if: steps.latest.outputs.move == 'true'
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.latest.outputs.move == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest to the published edge image
        if: steps.latest.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.edge-manifest.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          # crane tag writes the index's own bytes under latest, so latest
          # has the digest the release signed and attested.
          crane tag "$image@$DIGEST" latest
          moved=$(crane digest "$image:latest")
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::$image:latest is $moved, not the published $DIGEST"
            exit 1
          fi
          # A parallel release can take Latest after the check above; the
          # move may then have overwritten its image.
          now=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$now" != "$GITHUB_REF_NAME" ]; then
            echo "::error::GitHub's Latest moved to $now while $image:latest moved to $GITHUB_REF_NAME; re-run the latest jobs of the $now release"
            exit 1
          fi
          echo "$image:latest is $GITHUB_REF_NAME, \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  standard-latest:
    needs: [standard-manifest, release]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require this release to be GitHub's Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "standard latest stays: GitHub's Latest is $latest, not $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install crane
        if: steps.latest.outputs.move == 'true'
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.latest.outputs.move == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest to the published standard image
        if: steps.latest.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.standard-manifest.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-standard
          crane tag "$image@$DIGEST" latest
          moved=$(crane digest "$image:latest")
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::$image:latest is $moved, not the published $DIGEST"
            exit 1
          fi
          # A parallel release can take Latest after the check above; the
          # move may then have overwritten its image.
          now=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$now" != "$GITHUB_REF_NAME" ]; then
            echo "::error::GitHub's Latest moved to $now while $image:latest moved to $GITHUB_REF_NAME; re-run the latest jobs of the $now release"
            exit 1
          fi
          echo "$image:latest is $GITHUB_REF_NAME, \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
