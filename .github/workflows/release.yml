name: Release

# Publishing a non-draft GitHub release starts the trusted release workflow.
# Release events use this workflow from the default branch, not the tag commit.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

# `make release` writes inside the source tree - cmd/aether/resource_windows_*.syso,
# which it also removes, and the Android build's android/app/build - and every
# release job targets the same self-hosted label. Two overlapping releases
# sharing a working directory would race over both, so they queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.select.outputs.allowed }}
    steps:
      - name: Select runner
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || true)
          # A failed lookup deliberately disables the release.
          if [ "$permission" = admin ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: runner-policy
    if: ${{ needs.runner-policy.outputs.allowed == 'true' }}
    runs-on: [self-hosted, Linux, X64, moss]
    # The same Gradle-in-a-container build as ci.yml's release-build, plus the
    # image push and its smoke checks. This job also holds the release-*
    # concurrency group, so a wedged one would block the next release for
    # GitHub's six-hour default.
    timeout-minutes: 90
    steps:
      # Every release of the Android shell is signed with the same key, which
      # is the only way a later release installs over an earlier one. This is
      # the first step in the job so a missing secret ends the release in
      # seconds, before a toolchain is installed or anything is built: an
      # unsigned APK is worse than no APK, because nothing can update over
      # it. The keystore is written outside the checkout and deleted below;
      # only its path reaches the build.
      - name: Decode the Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="${missing:+$missing }$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the Android APK cannot be signed; these repository secrets are not set: $missing. Set all four (see the Android app section of docs/install.md), then rerun this release."
            exit 1
          fi
          keystore="$RUNNER_TEMP/aether-android.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so git describe stamps the tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      # Publishing a release does not run the PR pipeline, so gate the release
      # on the fast checks rather than publishing an untested binary.
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test

      # `make release` also builds and signs dist/aether-android.apk in its
      # pinned SDK container, and fails the release if apksigner cannot verify
      # it. It lands before the checksums, so the glob below covers it.
      - name: Cross-compile the release matrix
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: make release
      # The runner is self-hosted, so RUNNER_TEMP is not wiped for us.
      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aether-android.jks"
      - name: Checksums
        working-directory: dist
        run: sha256sum aether-* > checksums.txt

      # The binaries default to the image published from this same tag, so
      # the image must exist before the release becomes downloadable: an
      # image build/push failure must abort the release, not orphan it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate standard image tags
        id: standard-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/3xdevops/aether-standard
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Publish standard environment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/standard/Dockerfile
          push: true
          tags: ${{ steps.standard-meta.outputs.tags }}
          labels: ${{ steps.standard-meta.outputs.labels }}
      - name: Verify the published standard image is pullable
        run: docker pull ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}
      # A release whose default environment ships a broken toolchain is
      # worse than a failed release, so every tool must prove it runs.
      - name: Smoke-check the standard image toolchains
        run: |
          img=ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}
          set -x
          docker run --rm "$img" go version
          docker run --rm "$img" node --version
          docker run --rm "$img" npm --version
          docker run --rm "$img" python3 --version
          docker run --rm "$img" uv --version
          docker run --rm "$img" rustc --version
          docker run --rm "$img" cargo --version
          docker run --rm "$img" rg --version
          docker run --rm "$img" jq --version
          docker run --rm "$img" git --version

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/publish-release.sh "$GITHUB_REF_NAME" dist
