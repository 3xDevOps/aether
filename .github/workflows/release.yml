name: Release

# Publishing a non-draft GitHub release starts the trusted release workflow.
# Release events use this workflow from the default branch, not the tag commit.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

# Any two releases queue. Publishing different tags at the same time would
# still race on the GHCR `latest` tag and on /releases/latest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publisher-policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.select.outputs.allowed }}
    steps:
      - name: Check the publisher
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || true)
          # A failed lookup deliberately disables the release.
          if [ "$permission" = admin ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  # Each architecture runs the exact image it publishes on a native headless
  # Ubuntu host. No QEMU or host-installed Chromium changes the sandbox proof.
  browser-image:
    needs: publisher-policy
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the release tag
        run: sh scripts/android-version-code.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Build the versioned browser companion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/browser/Dockerfile
          load: true
          tags: ghcr.io/3xdevops/aether-browser:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}-main
      - name: Prove sandbox, local app, actions, captures and streams
        env:
          BROWSER_IMAGE: ghcr.io/3xdevops/aether-browser:${{ github.ref_name }}-${{ matrix.arch }}
        run: make browser-smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the already-tested local image, not a second independent build.
      - name: Publish the tested architecture
        env:
          BROWSER_IMAGE: ghcr.io/3xdevops/aether-browser:${{ github.ref_name }}-${{ matrix.arch }}
        run: docker push "$BROWSER_IMAGE"

  browser-manifest:
    needs: browser-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the server-version browser manifest
        run: |
          image="ghcr.io/3xdevops/aether-browser:$GITHUB_REF_NAME"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
      # New GHCR packages must be made public by the repository administrator.
      # An authenticated pull alone would ship a companion users cannot fetch.
      - name: Verify anonymous availability on both server architectures
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image="ghcr.io/3xdevops/aether-browser:$GITHUB_REF_NAME"
          docker --config "$config" pull --platform linux/amd64 "$image"
          docker --config "$config" pull --platform linux/arm64 "$image"

  # A job of its own that `release` waits for: a failed edge image stops the
  # release before its binaries are downloadable, and rerunning this job
  # does not repeat the Android build. Actions are pinned by commit because
  # this job can publish; each pin is the release its major tag named.
  edge-image:
    needs: publisher-policy
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate the release tag
        run: sh scripts/android-version-code.sh "$GITHUB_REF_NAME"
      - name: Run arm64 images for the smoke test
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A multi-platform image is an index, so the annotations go on the
      # index too; the package page and its repository link read them there.
      - name: Generate edge image tags, labels and annotations
        id: edge-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/3xdevops/aether-edge
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=aether-edge
            org.opencontainers.image.description=Aether edge: GitHub sign-in and relay for Aether servers
          annotations: |
            org.opencontainers.image.title=aether-edge
            org.opencontainers.image.description=Aether edge: GitHub sign-in and relay for Aether servers
      - name: Publish the edge image
        id: edge-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.edge-meta.outputs.tags }}
          labels: ${{ steps.edge-meta.outputs.labels }}
          annotations: ${{ steps.edge-meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=edge-amd64-main
            type=gha,scope=edge-arm64-main
      # Pulls with this job's login: a package GHCR has just created is
      # private until an administrator makes it public.
      - name: Verify, pull and smoke-test both edge image architectures
        env:
          DIGEST: ${{ steps.edge-build.outputs.digest }}
        run: |
          image=ghcr.io/3xdevops/aether-edge
          inspect=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME")
          tagged=$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" { print $2; exit }')
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$image:$GITHUB_REF_NAME is $tagged, not the pushed $DIGEST"
            exit 1
          fi
          index=$(docker buildx imagetools inspect --raw "$image@$DIGEST")
          {
            echo "### ghcr.io/3xdevops/aether-edge"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Platform | Immutable reference |"
            echo "| --- | --- |"
            echo "| linux/amd64, linux/arm64 | \`$image:$GITHUB_REF_NAME@$DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$image:$GITHUB_REF_NAME"
            docker pull --platform "linux/$arch" "$image@$DIGEST"
            platform=$(printf '%s' "$index" | jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            docker pull --platform "linux/$arch" "$image@$platform"
            # The smoke script's docker run then asks for this architecture
            # rather than the runner's.
            DOCKER_DEFAULT_PLATFORM="linux/$arch" sh scripts/edge-image-smoke.sh "$image@$platform"
            echo "| linux/$arch | \`$image@$platform\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      # Not a release failure: the image is published and pullable with
      # credentials. Until the package is public, users cannot pull it.
      - name: Check anonymous availability of the edge image
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image="ghcr.io/3xdevops/aether-edge:$GITHUB_REF_NAME"
          for arch in amd64 arm64; do
            if ! out=$(docker --config "$config" pull --platform "linux/$arch" "$image" 2>&1); then
              printf '%s\n' "$out"
              echo "::warning title=aether-edge is not public::$image (linux/$arch) cannot be pulled anonymously: $(printf '%s' "$out" | tail -n 1). A repository administrator must open https://github.com/orgs/3xDevOps/packages/container/package/aether-edge, choose Package settings, set Danger Zone > Change visibility to Public, and, if the package page does not show 3xDevOps/aether as its repository, use Connect repository to link it."
              exit 0
            fi
          done

  release:
    needs: [publisher-policy, browser-manifest, edge-image]
    if: ${{ needs.publisher-policy.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    # The same Gradle-in-a-container build as ci.yml's release-build, plus the
    # image push and its smoke checks. This job also holds the release-*
    # concurrency group, so a wedged one would block the next release for
    # GitHub's six-hour default.
    timeout-minutes: 90
    steps:
      # Every release of the Android shell is signed with the same key, which
      # is the only way a later release installs over an earlier one. This is
      # the first step in the job so a missing secret ends the release in
      # seconds, before a toolchain is installed or anything is built: an
      # unsigned APK is worse than no APK, because nothing can update over
      # it. The keystore is written outside the checkout and deleted below;
      # only its path reaches the build.
      - name: Decode the Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="${missing:+$missing }$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the Android APK and app bundle cannot be signed; these repository secrets are not set: $missing. Set all four (see the Android app section of docs/install.md), then rerun this release."
            exit 1
          fi
          keystore="$RUNNER_TEMP/aether-android.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so git describe stamps the tag

      # Before any toolchain and any build. The Android versionCode is derived
      # from the tag, and `make release` only reaches that derivation in its
      # last step - so a tag such as v0.5 used to fail after the whole matrix
      # was built, leaving the published release with no assets and
      # /releases/latest pointing at it until a human deleted both.
      - name: Validate the release tag
        run: sh scripts/android-version-code.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      # Publishing a release does not run the PR pipeline, so gate the release
      # on the fast checks rather than publishing an untested binary.
      - name: Vet
        run: make vet
      # Every package runs at once here, so the slowest one takes longer
      # than in CI, where it has a job of its own. go test stops a package
      # at 10 minutes unless told otherwise, and the v0.5.2-alpha.3 release
      # failed on that limit after it was published.
      - name: Unit tests
        env:
          GOFLAGS: -timeout=30m
        run: make test

      # `make release` also builds and signs dist/aether-android.apk and
      # dist/aether-android.aab in its pinned SDK container, and fails the
      # release if either does not verify. They land before the checksums, so
      # the glob below covers them.
      # Restored from the cache release-build writes on main. A release
      # event's ref is the tag, so this job does not save the cache.
      # Pinned by commit. This step runs after the signing keystore is
      # decoded, and the job can publish, so a retargeted v4 tag must not
      # be able to change the code that runs here.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle-cache
          key: gradle-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/gradle.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.environment }}-
      # VERSION is the release tag itself, not `git describe`: with two tags
      # on one commit describe can pick the other one, and the artifacts would
      # be stamped for a release nobody published. The step above has already
      # rejected any tag that is not vMAJOR.MINOR.PATCH with an optional
      # pre-release suffix, so the name is safe to hand to a shell.
      - name: Cross-compile the release matrix
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GRADLE_HOME: ${{ github.workspace }}/.gradle-cache
        run: make release VERSION="$GITHUB_REF_NAME"
      # The keystore is removed so later steps and the uploaded workspace do
      # not retain it. The hosted VM is discarded at the end either way.
      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aether-android.jks"
      - name: Checksums
        working-directory: dist
        run: sha256sum aether-* > checksums.txt

      # The binaries default to the image published from this same tag, so
      # the image must exist before the release becomes downloadable: an
      # image build/push failure must abort the release, not orphan it.
      - name: Enable standard-image cross-architecture builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate standard image tags
        id: standard-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/3xdevops/aether-standard
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Publish standard environment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/standard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.standard-meta.outputs.tags }}
          labels: ${{ steps.standard-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=standard-amd64-main
            type=gha,scope=standard-arm64-main
      - name: Verify both standard image architectures are anonymously pullable
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          image="ghcr.io/3xdevops/aether-standard:$GITHUB_REF_NAME"
          docker --config "$config" pull --platform linux/amd64 "$image"
          docker --config "$config" pull --platform linux/arm64 "$image"
      # A release whose default environment ships a broken toolchain is
      # worse than a failed release, so every tool must prove it runs.
      - name: Smoke-check both standard image toolchains and native Git
        run: |
          img=ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" "$img" sh -euxc '
              go version
              node --version
              npm --version
              python3 --version
              uv --version
              rustc --version
              cargo --version
              rg --version
              jq --version
              gh --version
              git --version
              repo=$(mktemp -d)
              trap '\''rm -rf "$repo"'\'' EXIT
              git init -q --initial-branch=main "$repo"
              cd "$repo"
              git config user.name smoke
              git config user.email smoke@example.invalid
              tree=$(git mktree </dev/null)
              old=$(printf "old\n" | git commit-tree "$tree")
              git update-ref refs/heads/main "$old"
              new=$(printf "new\n" | git commit-tree "$tree" -p "$old")
              printf "start\nupdate HEAD %s %s\nprepare\ncommit\n" "$new" "$old" |
                git update-ref --stdin
              test "$(git rev-parse HEAD)" = "$new"
              test "$(git symbolic-ref HEAD)" = refs/heads/main
              test -x "$(git --exec-path)/git-remote-https"
              printf "protocol=https\nhost=example.invalid\nusername=smoke\npassword=smoke\n\n" |
                git credential-store --file="$repo/credentials" store
              test -s "$repo/credentials"
              ssh-keygen -q -t ed25519 -N "" -f "$repo/key"
              printf "signed\n" | git -c gpg.format=ssh -c user.signingkey="$repo/key" commit-tree -S "$tree" -p "$new"
              gpg --version
            '
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/publish-release.sh "$GITHUB_REF_NAME" dist
