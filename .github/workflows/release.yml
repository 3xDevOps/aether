name: Release

# Tagging is the release trigger: push a `vX.Y.Z` tag and this builds the
# cross-compile matrix, checksums it, and publishes a GitHub release whose
# assets are exactly what scripts/install.sh downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git describe stamps the tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      # A tag push does not run the PR pipeline, so gate the release on the
      # fast checks rather than publishing an untested binary.
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test

      - name: Cross-compile the release matrix
        run: make release
      - name: Checksums
        working-directory: dist
        run: sha256sum aether-* > checksums.txt

      # The binaries default to the image published from this same tag, so
      # the image must exist before the release becomes downloadable: an
      # image build/push failure must abort the release, not orphan it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate standard image tags
        id: standard-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/3xdevops/aether-standard
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Publish standard environment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/standard/Dockerfile
          push: true
          tags: ${{ steps.standard-meta.outputs.tags }}
          labels: ${{ steps.standard-meta.outputs.labels }}
      - name: Verify the published standard image is pullable
        run: docker pull ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}
      # A release whose default environment ships a broken toolchain is
      # worse than a failed release, so every tool must prove it runs.
      - name: Smoke-check the standard image toolchains
        run: |
          img=ghcr.io/3xdevops/aether-standard:${{ github.ref_name }}
          set -x
          docker run --rm "$img" go version
          docker run --rm "$img" node --version
          docker run --rm "$img" npm --version
          docker run --rm "$img" python3 --version
          docker run --rm "$img" uv --version
          docker run --rm "$img" rustc --version
          docker run --rm "$img" cargo --version
          docker run --rm "$img" rg --version
          docker run --rm "$img" jq --version
          docker run --rm "$img" git --version

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/publish-release.sh "$GITHUB_REF_NAME" dist
