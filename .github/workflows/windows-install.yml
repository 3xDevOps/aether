name: Windows install

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.shell }}, Node ${{ matrix.node }}, desktop ${{ matrix.desktop }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            node: on PATH
            desktop: zip
          - shell: pwsh
            node: downloaded
            desktop: source
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the Defender signature update in the background
        shell: powershell
        run: ./scripts/windows-defender.ps1 -Mode StartUpdate
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
          variant: windows-install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - name: Installer regression scenarios
        run: ./scripts/install-test.ps1
      - name: Build the embedded dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows client with release metadata
        run: |
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -64 `
            -icon desktop/build/icon.ico -manifest packaging/windows/aether.manifest `
            -ver-major 0 -ver-minor 5 -ver-patch 1 -ver-build 0 `
            -product-ver-major 0 -product-ver-minor 5 -product-ver-patch 1 -product-ver-build 0 `
            -file-version 0.5.1.0 -product-version 0.5.1.0 `
            -o cmd/aether/resource_windows_amd64.syso packaging/windows/versioninfo.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-s -w -X github.com/3xDevOps/Aether/internal/version.Version=dev -X github.com/3xDevOps/Aether/internal/version.Commit=$env:GITHUB_SHA" -o "$env:RUNNER_TEMP/aether.exe" ./cmd/aether
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # CI's native Windows job owns module-cache writes and the localops
      # unit regressions. Only this lane writes the installer's compiler
      # cache, before Defender is armed: archiving under its realtime scan
      # took eight minutes.
      - uses: ./.github/actions/go-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shell == 'powershell'
        with:
          mode: save
          variant: windows-install
          save-modules: 'false'
      - id: desktop
        if: matrix.desktop == 'zip'
        uses: ./.github/actions/desktop-windows-zip
        with:
          version: v0.5.1-alpha.4
          arch: amd64
      - name: Enable Defender realtime and cloud protection
        shell: powershell
        run: ./scripts/windows-defender.ps1 -Mode Prepare
      - name: Install, rebuild, and launch the desktop under Defender
        env:
          DESKTOP_ZIP: ${{ steps.desktop.outputs.zip }}
        run: |
          if ($env:DESKTOP_ZIP) {
            ./scripts/install-smoke.ps1 -Cli "$env:RUNNER_TEMP/aether.exe" -DesktopZip $env:DESKTOP_ZIP
          } else {
            ./scripts/install-smoke.ps1 -Cli "$env:RUNNER_TEMP/aether.exe" -WithoutNode
          }
      - name: Upload the installed desktop screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ matrix.desktop }}
          path: ${{ runner.temp }}/windows-desktop.png
          if-no-files-found: ignore
          retention-days: 7

  # What Linux cannot show: replacing aether.exe while it runs, and the
  # desktop app's helper swapping the app directory the running app holds,
  # under real-time Defender. docs/testing.md has the details.
  update:
    name: update (running aether.exe and desktop)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    env:
      OLD_VERSION: v0.5.1-alpha.4
      NEW_VERSION: v0.5.1-alpha.5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the Defender signature update in the background
        run: ./scripts/windows-defender.ps1 -Mode StartUpdate
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
          variant: windows-install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version
          no-cache: true
      - name: Build the embedded dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Both clients trust the fake release's key instead of the release
      # key. The overlay swaps one file at build time; no source changes.
      - name: Build the old and new clients and the fake release
        run: |
          go build -o "$env:RUNNER_TEMP/fake-release.exe" ./internal/selfupdate/releasetest/cmd/fake-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $public = & "$env:RUNNER_TEMP/fake-release.exe" -pubkey
          $keys = Join-Path $PWD 'internal/selfupdate/keys.go'
          $source = [IO.File]::ReadAllText($keys)
          $patched = [regex]::Replace($source, '"[A-Za-z0-9+/]{43}="', ('"' + $public + '"'))
          if ($patched -eq $source) { throw 'keys.go has no release key to replace.' }
          $trusting = Join-Path $env:RUNNER_TEMP 'keys.go'
          [IO.File]::WriteAllText($trusting, $patched, (New-Object Text.UTF8Encoding($false)))
          $overlay = Join-Path $env:RUNNER_TEMP 'overlay.json'
          [IO.File]::WriteAllText($overlay, (@{ Replace = @{ $keys = $trusting } } | ConvertTo-Json), (New-Object Text.UTF8Encoding($false)))
          foreach ($pair in @(@('old', $env:OLD_VERSION), @('new', $env:NEW_VERSION))) {
            go build -trimpath -overlay $overlay -ldflags "-s -w -X github.com/3xDevOps/Aether/internal/version.Version=$($pair[1]) -X github.com/3xDevOps/Aether/internal/version.Commit=$env:GITHUB_SHA" -o "$env:RUNNER_TEMP/aether-$($pair[0]).exe" ./cmd/aether
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - id: desktop
        uses: ./.github/actions/desktop-windows-zip
        with:
          version: ${{ env.OLD_VERSION }}
          arch: amd64
      - name: Enable Defender realtime and cloud protection
        run: ./scripts/windows-defender.ps1 -Mode Prepare
      - name: Update a running aether.exe and desktop app under Defender
        env:
          DESKTOP_ZIP: ${{ steps.desktop.outputs.zip }}
        run: |
          ./scripts/update-smoke.ps1 `
            -OldCli "$env:RUNNER_TEMP/aether-old.exe" -NewCli "$env:RUNNER_TEMP/aether-new.exe" `
            -FakeRelease "$env:RUNNER_TEMP/fake-release.exe" -DesktopZip $env:DESKTOP_ZIP `
            -OldVersion $env:OLD_VERSION -NewVersion $env:NEW_VERSION `
            -Playwright "$env:GITHUB_WORKSPACE/web/node_modules/playwright"
