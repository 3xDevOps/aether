# The build runs in a container with a mounted Gradle home, so the caches are
# the only thing that survives between runs.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=true

# Nothing may reach the network for a toolchain or an SDK package: the
# container carries exactly one JDK and one platform, and a mismatch has to
# fail loudly instead of downloading a second one.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
android.builder.sdkDownload=false

# The release keystore's passwords reach the build as environment variables,
# and the configuration cache writes its inputs to disk under .gradle/.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
