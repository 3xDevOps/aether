# Everything the Android shell resolves is pinned here. No version ranges: the
# APK has to be reproducible from a tag. AGP carries its own Kotlin compiler
# since 9.0, so there is no Kotlin plugin version to keep in step with it.
[versions]
agp = "9.4.0"
androidx-activity = "1.13.0"
# 1.18.0 is the newest androidx.core that compiles against the API 36
# platform the pinned container carries; 1.19.0 demands API 37.
androidx-core = "1.18.0"
junit = "4.13.2"
# The real org.json for the unit tests: android.jar's copy is a stub.
json = "20260814"
# The UnifiedPush connector: distributor registration, and RFC 8291
# decryption of what arrives with the Web Push keys it generates.
unifiedpush-connector = "3.3.5"
# Origin-scoped web message listeners, for the dashboard's push switch.
androidx-webkit = "1.18.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
json = { module = "org.json:json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush-connector" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
