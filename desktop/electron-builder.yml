# electron-builder configuration for the Aether desktop shell.
#
# The aether CLI binary is NOT bundled. The shell discovers it at launch:
# AETHER_BIN first, then PATH, then the install script's default locations
# (/usr/local/bin, ~/.local/bin). Install the CLI and link it before
# launching the app - see docs/install.md.
appId: io.aether.desktop
productName: Aether

# `build/` is electron-builder's default buildResources directory: it holds
# packaging inputs only and is never bundled into the app. icon.png there is
# picked up for every platform - macOS and Windows convert it to .icns/.ico,
# Linux rasterizes the icon set the AppImage and deb install.
directories:
  output: dist

files:
  - main.js
  - notify.js
  - preload.js
  - package.json

# aether://run/<id> deep links (main.js handleDeepLink). macOS reads the
# scheme from the bundle's Info.plist, so a runtime
# setAsDefaultProtocolClient alone is not enough there; Linux gets an
# x-scheme-handler MIME entry in the .desktop file.
protocols:
  - name: Aether
    schemes:
      - aether

mac:
  # Ad-hoc signature: Apple Silicon refuses to launch an unsigned binary,
  # and `aether gui build` runs without a certificate. Gatekeeper never
  # sees a locally built app (no quarantine flag), so this is enough for a
  # local install. A release build overrides identity with a real one.
  identity: "-"
  hardenedRuntime: false
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  # The deb target refuses to build without an explicit maintainer; the
  # package.json author alone is only a fallback for the other targets.
  maintainer: 3xDevOps <aether@users.noreply.github.com>
  category: Development
  target:
    - AppImage
    - deb

# No publishing from this repo: builds are local artifacts (`--publish never`
# on the CLI; a bare string here would be parsed as a provider name). A
# deployment that wants auto-update should point this at its own release
# feed, e.g.
#
#   publish:
#     provider: github
#     owner: <your-org>
#     repo: <your-fork>
#
# (or a generic provider with a URL you control), and sign the binaries -
# unsigned auto-update is refused on macOS and Windows.
publish: null
