# The proxy container of TestEdgeUpgrade, terminating TLS with the test's
# certificate. Port 8443 is Traefik's place in front of the edge, with the
# headers packaging/nginx/aether-edge.conf.example sets; Docker's DNS
# resolves the edge's container anew after each switch. Port 443 is
# github.com and api.github.com for the edge, in front of the test's fake
# GitHub on the host.
worker_processes 1;
events {}
http {
    access_log off;
    resolver 127.0.0.11 valid=1s;
    map $http_upgrade $aether_edge_connection {
        default upgrade;
        ''      close;
    }
    server {
        listen 8443 ssl;
        ssl_certificate     /etc/qualify/cert.pem;
        ssl_certificate_key /etc/qualify/key.pem;
        location / {
            set $edge aether-edge;
            proxy_pass http://$edge:8443;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $aether_edge_connection;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
    server {
        listen 443 ssl;
        ssl_certificate     /etc/qualify/cert.pem;
        ssl_certificate_key /etc/qualify/key.pem;
        location / {
            proxy_pass http://@FAKE_GITHUB@;
        }
    }
}
