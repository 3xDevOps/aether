{{define "reviewer"}}{{template "top" .}}
<div class="panel">
<p>Sign in with the reviewer account this edge's operator gave the app directory. It reaches one Cloudfield server and nothing else on this edge.</p>
<form method="post" action="/connectors/reviewer">
{{range .Data.Fields}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">
{{end}}<label>Login <input name="login" autocomplete="username" required></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit" class="primary wide">Sign in</button>
</form>
</div>
{{template "bottom" .}}{{end}}
