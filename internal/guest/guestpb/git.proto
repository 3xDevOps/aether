// The helper's git service: the server's git engine running inside the VM
// over the session's checkouts, which live on the VM's own disks. It is a
// process of its own on vsock port 1100. docs/vm-guest.md describes it.
syntax = "proto3";

package aether.guest.v1;

option go_package = "github.com/3xDevOps/Aether/internal/guest/guestpb";

service Git {
  // Setup gives each checkout the run branch on its first boot and its files
  // to the session user, records its identity and starts its diff watch. It is called before the session's
  // first process starts, and again after every server restart.
  rpc Setup(SetupRequest) returns (SetupReply);
  // Watch streams one checkout's diff watch, starting it when it does not
  // run. The first acknowledgement names the checkout; a later Watch of the
  // same checkout replaces this one. A diff or head event counts as
  // delivered only once the server acknowledges its sequence number; while
  // no Watch is open, snapshots fail and are retried as history gaps.
  rpc Watch(stream WatchAck) returns (stream WatchEvent);
  // Flush takes a last snapshot of the checkout, returns once Watch
  // delivered it, and stops the checkout's diff watch until the next Watch.
  rpc Flush(FlushRequest) returns (FlushReply);
  // Objects streams a pack of every object reachable from wants and from
  // none of the haves the checkout holds.
  rpc Objects(ObjectsRequest) returns (stream Chunk);
  // Patch renders the checkout's live diff, as the server's RunPatch does
  // for a checkout on its own disk.
  rpc Patch(PatchRequest) returns (PatchReply);
  // Head returns the commit the checkout's HEAD names.
  rpc Head(HeadRequest) returns (HeadReply);
  // Stage writes a tree of the whole checkout, as a snapshot does: for
  // evidence within its bound, or for the server's final commit over a copy
  // of the checkout's own index, which Install can then make the
  // checkout's.
  rpc Stage(StageRequest) returns (StageReply);
  // Install adds a pack's objects to the checkout and moves its refs, as
  // the checkout's owner. The first message names what to do, every
  // message carries pack data.
  rpc Install(stream InstallChunk) returns (InstallReply);
  // Tree, ReadFile, WriteFile and FileDiff are the Files view's calls on
  // the checkout, as the server's engine answers them for a checkout on its
  // own disk.
  rpc Tree(TreeRequest) returns (TreeReply);
  rpc ReadFile(ReadFileRequest) returns (FileReply);
  rpc WriteFile(WriteFileRequest) returns (FileReply);
  rpc FileDiff(FileDiffRequest) returns (PatchReply);
  // Sync serves a live overlay's endpoint at the checkout; the first chunk
  // names the checkout and every chunk carries the overlay's stream.
  rpc Sync(stream SyncChunk) returns (stream SyncChunk);
}

// GitFailure is the status detail of a call that failed for a reason the
// server's git engine names, such as a snapshot tree the guest no longer
// holds.
message GitFailure {
  string reason = 1;
}

message SetupRequest {
  repeated Checkout checkouts = 1;
}

// Checkout describes a session checkout the kernel command line mounted
// under key: the run branch it gets on its first boot, the identity the
// git service reads it with, and the session user, uid:gid, who must own
// its files.
message Checkout {
  string key = 1;
  string workspace = 2;
  string branch = 3;
  string base = 4;
  string base_branch = 5;
  string origin = 6;
  uint32 uid = 7;
  uint32 gid = 8;
}

message SetupReply {}

message WatchAck {
  // key names the checkout on the first acknowledgement only.
  string key = 1;
  uint64 seq = 2;
  // error, when set, refuses the event: the guest records a history gap
  // and retries, as for a failed publication on the server.
  string error = 3;
}

message WatchEvent {
  // seq numbers the events that need an acknowledgement; changed events
  // carry 0.
  uint64 seq = 1;
  oneof kind {
    // diff is the run.diff payload as JSON.
    bytes diff = 2;
    // head is the commit HEAD moved to.
    string head = 3;
    // changed reports a file change since the last changed event.
    bool changed = 4;
  }
}

message FlushRequest {
  string key = 1;
}

message FlushReply {}

message ObjectsRequest {
  string key = 1;
  repeated string wants = 2;
  repeated string haves = 3;
}

message Chunk {
  bytes data = 1;
}

message HeadRequest {
  string key = 1;
}

message HeadReply {
  string commit = 1;
}

message StageRequest {
  string key = 1;
  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    PURPOSE_COMMIT = 1;
    PURPOSE_EVIDENCE = 2;
  }
  Purpose purpose = 2;
}

message StageReply {
  string tree = 1;
  string head = 2;
}

message RefUpdate {
  string ref = 1;
  string new = 2;
  // old, when set, must be the ref's value for the update to happen.
  string old = 3;
}

message InstallChunk {
  string key = 1;
  repeated RefUpdate updates = 2;
  string reflog_message = 3;
  // index, when set, makes the index Stage last wrote for a commit the
  // checkout's, provided its tree is this one.
  string index = 4;
  bytes data = 5;
}

message InstallReply {}

message TreeRequest {
  string key = 1;
  string dir = 2;
}

message TreeEntry {
  string name = 1;
  string kind = 2;
  int64 size = 3;
}

message TreeReply {
  repeated TreeEntry entries = 1;
}

message ReadFileRequest {
  string key = 1;
  string path = 2;
  uint32 max_bytes = 3;
}

message WriteFileRequest {
  string key = 1;
  string path = 2;
  bytes content = 3;
  string revision = 4;
}

message FileReply {
  bytes content = 1;
  bool truncated = 2;
  int64 size = 3;
}

message FileDiffRequest {
  string key = 1;
  string path = 2;
}

message SyncChunk {
  string key = 1;
  bytes data = 2;
}

message PatchRequest {
  string key = 1;
  // from is a snapshot tree to render from; empty renders against the
  // checkout's effective base.
  string from = 2;
  uint32 max_bytes = 3;
}

message PatchReply {
  string base = 1;
  string text = 2;
  bool truncated = 3;
  string fork_tree = 4;
}
